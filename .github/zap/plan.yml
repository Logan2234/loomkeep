env:
  contexts:
    - name: loomkeep
      # Targets the ephemeral docker-compose stack web-audit.yml stands up
      # for this job, not production — see LK ticket "Ephemeral
      # docker-compose environment for ZAP scans". The api is a separate
      # origin here (localhost:3000, unlike prod's same-origin Caddy proxy),
      # so it's out of this context's reach by construction; api coverage
      # comes from the sibling plan-api.yml job instead. Web is published on
      # 18080, not the usual 8080 (docker/docker-compose.ci.yml) — ZAP's own
      # scanning proxy binds to 8080 on the runner's host network, and the
      # two collide otherwise.
      urls:
        - http://localhost:18080/

      includePaths:
        - http://localhost:18080/.*

      excludePaths:
        - http://localhost:18080/api/auth/logout

      authentication:
        # The web app delegates API calls to localhost:3000 in this disposable
        # stack. Cookies are host-scoped rather than port-scoped, so the
        # session created here is also available through the web origin.
        method: json
        parameters:
          loginPageUrl: ""
          loginRequestUrl: http://localhost:3000/api/auth/login
          loginRequestBody: '{"identifier":"{%username%}","password":"{%password%}"}'
        verification:
          method: poll
          loggedInRegex: "200 OK"
          loggedOutRegex: "401 Unauthorized"
          pollFrequency: 60
          pollUnits: seconds
          pollUrl: http://localhost:3000/api/users/me
          pollPostData: ""

      sessionManagement:
        method: cookie

      users:
        - name: zap-user
          credentials:
            username: alice@example.com
            password: Password123!

jobs:
  - type: spider
    parameters:
      context: loomkeep
      user: zap-user
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: loomkeep
      user: zap-user
      policy: Default Policy

  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk/zap-results
      reportFile: zap-results.sarif
      reportTitle: Loomkeep ZAP Security Scan
      reportDescription: OWASP ZAP security scan of Loomkeep
      displayReport: false
    risks:
      - high
      - medium
      - low
      - info
    confidences:
      - high
      - medium
      - low
      - falsepositive
