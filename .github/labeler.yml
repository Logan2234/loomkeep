api:
  - changed-files:
      - any-glob-to-any-file: apps/api/**

# Translations alone get i18n, not web.
web:
  - changed-files:
      - all-globs-to-any-file:
          - apps/web/**
          - "!apps/web/messages/**"

i18n:
  - changed-files:
      - any-glob-to-any-file: apps/web/messages/**

database:
  - changed-files:
      - any-glob-to-any-file: apps/api/prisma/migrations/**

ee:
  - changed-files:
      - any-glob-to-any-file:
          - apps/api/src/ee/**
          - apps/web/src/lib/ee/**

mobile:
  - changed-files:
      - any-glob-to-any-file:
          - apps/mobile/**
          - apps/web/src/lib/native/**

shared:
  - changed-files:
      - any-glob-to-any-file: packages/shared/**

docker:
  - changed-files:
      - any-glob-to-any-file:
          - apps/api/Dockerfile
          - apps/web/Dockerfile
          - docker/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**

# Without CHANGELOG.md, which nearly every PR touches.
documentation:
  - any:
      - changed-files:
          - all-globs-to-any-file:
              - "**/*.md"
              - "!CHANGELOG.md"
              - "!.claude/**"
      - changed-files:
          - any-glob-to-any-file: apps/docs/**
