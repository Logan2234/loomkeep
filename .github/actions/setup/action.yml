name: Set up the workspace
description: >-
  pnpm, the Node version from .nvmrc with the pnpm store cached, the workspace
  installed from the lockfile and, unless turned off, packages/shared built
  (api and web import it through its dist/).

inputs:
  build-shared:
    description: Whether to build packages/shared after installing.
    default: "true"
  check-latest:
    description: Passed to actions/setup-node.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        check-latest: ${{ inputs.check-latest }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.build-shared == 'true'
      run: pnpm build:package
      shell: bash
