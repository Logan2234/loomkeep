name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Only ever one deploy in flight; a newer push supersedes an older one still queued.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The deploy needs no checkout and no GitHub API call — everything happens
# over SSH on the VPS with its own secrets — so GITHUB_TOKEN gets no scope;
# only the notify job asks for read access, to check main's head.
permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The VPS_* secrets live in this environment, limited to main, so no
    # other branch's workflow can read them; it also records each deploy.
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The host key the runner must find (`SHA256:…`, from
          # `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the VPS):
          # without it, a hijacked DNS or route gets the key and the script.
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          # Deploys the exact commit CI validated, not whatever main's head is
          # by now. The rest (pre-deploy dump, start, health wait, rollback)
          # is the checked-out commit's own .github/deploy/vps-deploy.sh.
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            DEPLOY_SHA="$DEPLOY_SHA" bash .github/deploy/vps-deploy.sh
      # The healthchecks above run inside the containers: a broken Caddy
      # route, certificate or Cloudflare rule would still pass them. This
      # goes through the same path as a visitor; a failure fails the job,
      # so the ntfy alert below fires.
      - name: Check the public site
        run: |
          for url in https://loomkeep.app/ https://loomkeep.app/api/health; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 6 --retry-all-errors --max-time 15 "$url"
            echo "$url answers"
          done

  # Says how it went on ntfy (NTFY_TOPIC_URL: the topic's full URL, e.g.
  # https://ntfy.sh/<unguessable name>, which is all it takes to post or
  # read): a skipped deploy otherwise goes unnoticed, as #433 and #438 did.
  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/deploy
      - name: Notify on ntfy
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          export MAIN_SHA
          bash .github/deploy/notify.sh
