name: Web Audit

on:
  # Deliberately no push/PR-adjacent trigger: this job takes ~5 minutes and
  # scans a full ephemeral stack, which isn't worth the wait on every merge
  # to main. Weekly cadence plus on-demand covers it.
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Web Audit (Pa11y + OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    # Required by docker/docker-compose.yml's `:?` interpolation — every step
    # that invokes `docker compose` (including `down` on teardown, and `logs`
    # when readiness times out) needs these resolvable, not just the step
    # that first brings the stack up.
    env:
      POSTGRES_PASSWORD: ci-zap-postgres-password
      JWT_ACCESS_SECRET: ci-zap-access-secret
      JWT_REFRESH_SECRET: ci-zap-refresh-secret
      BACKUP_ENCRYPTION_PUBLIC_KEY: ci-zap-unused-backup-key

    steps:
      # Checks out main's current tip. Its SHA-tagged api/web images already
      # sit on GHCR from CI's docker-push job (.github/workflows/ci.yml), so
      # this job never needs to build anything itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Stand up an ephemeral api+web+db stack (docker/docker-compose.yml)
      # instead of scanning https://loomkeep.app directly — activeScan sends
      # real attack payloads, and Logan isn't comfortable with that hitting
      # production (no staging environment exists otherwise). Secrets are
      # throwaway, CI-only values (job-level `env:` above): this stack never
      # sees real traffic and is torn down at the end of the job.
      - name: Start ephemeral stack
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml pull
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml up -d

      # The api migrates its own schema on boot (see apps/api/Dockerfile's
      # CMD), but there's no signal here for "migrations done, server
      # listening" beyond polling — same for web, which depends_on: api with
      # no condition, so compose considers it "up" the instant the container
      # starts, well before SvelteKit's Node server is actually accepting
      # connections.
      - name: Wait for stack readiness
        run: |
          for service in "api http://localhost:3000/api/health" "web http://localhost:18080/"; do
            name=${service%% *}
            url=${service#* }
            echo "waiting for $name ($url)..."
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then
                echo "$name is up"
                break
              fi
              if [ "$attempt" = 30 ]; then
                echo "$name never became ready" >&2
                docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml logs "$name" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # Runs against the ephemeral stack instead of https://loomkeep.app —
      # same reasoning as the ZAP steps below, one real environment to point
      # every audit at. .github/pa11y/pa11yci.ci.json mirrors the root
      # .pa11yci.json with localhost:18080 urls.
      - name: Run Pa11y CI
        run: npx --yes pa11y-ci@4.1.1 --config .github/pa11y/pa11yci.ci.json
        continue-on-error: true
      # pa11y-ci has no built-in SARIF reporter, so accessibility findings
      # only ever lived in this step's console log. pa11yci.ci.json's
      # defaults.reporters loads a small local reporter (alongside the
      # normal "cli" one) that writes pa11y-results.sarif — see
      # .github/pa11y/sarif-reporter.js. `if: always()` because a threshold
      # violation exits pa11y-ci non-zero, but the SARIF is still written.
      - name: Upload Pa11y SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: pa11y-results.sarif
          category: pa11y

      # Seeds synthetic users/library data (apps/api/prisma/seed.ts) so the
      # crawl/scan has real pages to find instead of an empty database.
      # Runs from the runner rather than inside the api container: the seed
      # script needs ts-node and other devDependencies that the prod-only
      # runtime image (see apps/api/Dockerfile's `pnpm deploy --prod`)
      # doesn't carry.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - run: pnpm --filter @loomkeep/api exec prisma generate
      - name: Seed synthetic data
        env:
          DATABASE_URL: postgresql://loomkeep:ci-zap-postgres-password@localhost:5432/loomkeep?schema=public
        run: pnpm --filter @loomkeep/api exec prisma db seed

      # The report job's reportDir (.github/zap/plan*.yml) isn't created
      # automatically by the automation framework — without this the report
      # job fails with NoSuchFileException. `chmod` matters too: the ZAP
      # container runs as its own internal user and writes into this
      # directory over the bind mount — action-af's own `chmod a+w` only
      # touches the workspace root, not a subdirectory created before it
      # runs, so without this the container hits AccessDeniedException
      # trying to write the report into a dir it doesn't own.
      - run: mkdir -p zap-results && chmod a+w zap-results
      - name: Run ZAP (web)
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d
        with:
          plan: .github/zap/plan.yml
      # Unblocks activeScan-ing write endpoints now that it's the ephemeral
      # stack's synthetic data taking the hit, not production — was removed
      # as dead code from this workflow previously since its old target
      # (/api/openapi.json) doesn't even exist in prod (Swagger is dev-only,
      # see apps/api/src/main.ts).
      - name: Run ZAP (api)
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d
        with:
          plan: .github/zap/plan-api.yml
      - name: List ZAP results
        if: always()
        run: find zap-results -type f -maxdepth 2 -print

      - name: Tear down ephemeral stack
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml down -v

      # Code Scanning's upload-sarif step always sends a file:// checkoutURI
      # and rejects the whole upload if any result location is absolute
      # with a different scheme — the sarif-json template's locations are
      # the scanned page's own http(s):// URL (see ZAP's own docs example),
      # so without this every ZAP finding fails to upload with "SARIF URI
      # scheme http did not match the checkout URI scheme file". Writes to
      # *new* files rather than overwriting the *-results.sarif.json files
      # in place: those were created by the ZAP container's own user over
      # the bind mount, so they're readable but not writable by the runner
      # user this step runs as (PermissionError on open(..., "w")).
      - name: Rewrite ZAP SARIF locations for Code Scanning
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          for src, dst in [
              ("zap-results/zap-results.sarif.json", "zap-results/zap-results.fixed.sarif.json"),
              ("zap-results/zap-api-results.sarif.json", "zap-results/zap-api-results.fixed.sarif.json"),
          ]:
              if not os.path.exists(src):
                  continue

              with open(src) as f:
                  sarif = json.load(f)

              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      for location in result.get("locations", []):
                          artifact = location.get("physicalLocation", {}).get(
                              "artifactLocation", {}
                          )
                          uri = artifact.get("uri", "")
                          if uri.startswith("http://") or uri.startswith("https://"):
                              parsed_path = urlparse(uri).path or "/"
                              slug = (
                                  "index"
                                  if parsed_path == "/"
                                  else parsed_path.lstrip("/")
                              )
                              artifact["uri"] = f"zap-findings/{slug}"

              with open(dst, "w") as f:
                  json.dump(sarif, f)
          PY
      - name: Upload ZAP SARIF (web)
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: zap-results/zap-results.fixed.sarif.json
          category: zap
      - name: Upload ZAP SARIF (api)
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: zap-results/zap-api-results.fixed.sarif.json
          category: zap-api
