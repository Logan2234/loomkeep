name: Web Audit

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-audit
  cancel-in-progress: true

jobs:
  pa11y:
    name: Pa11y accessibility
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run Pa11y CI
        run: npx --yes pa11y-ci@4.1.1 --config .pa11yci.json

  zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - name: Run ZAP
        uses: zaproxy/action-af@v0.3.0
        with:
          plan: .github/zap/plan.yml
      - name: List ZAP results
        if: always()
        run: find zap-results -type f -maxdepth 2 -print
      - name: Upload ZAP SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: zap-results/zap-results.sarif
          category: zap

