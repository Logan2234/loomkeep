name: Web Audit

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-audit
  cancel-in-progress: true

jobs:
  pa11y:
    name: Pa11y accessibility
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write
    steps:
      # pa11y-ci resolves `--config .pa11yci.json` relative to the working
      # directory — without checking out the repo first, no such file exists
      # on the runner and the job always fails with "config file ... could
      # not be loaded" before ever reaching a URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run Pa11y CI
        run: npx --yes pa11y-ci@4.1.1 --config .pa11yci.json
      # pa11y-ci has no built-in SARIF reporter, so accessibility findings
      # only ever lived in this step's console log. .pa11yci.json's
      # defaults.reporters loads a small local reporter (alongside the
      # normal "cli" one) that writes pa11y-results.sarif — see
      # .github/pa11y/sarif-reporter.js. `if: always()` because a threshold
      # violation exits pa11y-ci non-zero, but the SARIF is still written.
      - name: Upload Pa11y SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: pa11y-results.sarif
          category: pa11y

  zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest
    # Same guard as pa11y above — skip scanning prod off the back of a
    # failed/stale Deploy run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The report job's reportDir (.github/zap/plan.yml) isn't created
      # automatically by the automation framework — without this the report
      # job fails with NoSuchFileException. `chmod` matters too: the ZAP
      # container runs as its own internal user and writes into this
      # directory over the bind mount — action-af's own `chmod a+w` only
      # touches the workspace root, not a subdirectory created before it
      # runs, so without this the container hits AccessDeniedException
      # trying to write the report into a dir it doesn't own.
      - run: mkdir -p zap-results && chmod a+w zap-results
      - name: Run ZAP
        uses: zaproxy/action-af@v0.3.0
        with:
          plan: .github/zap/plan.yml
      - name: List ZAP results
        if: always()
        run: find zap-results -type f -maxdepth 2 -print
      # Code Scanning's upload-sarif step always sends a file:// checkoutURI
      # and rejects the whole upload if any result location is absolute
      # with a different scheme — the sarif-json template's locations are
      # the scanned page's own https:// URL (see ZAP's own docs example),
      # so without this every ZAP finding fails to upload with "SARIF URI
      # scheme https did not match the checkout URI scheme file".
      - name: Rewrite ZAP SARIF locations for Code Scanning
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          path = "zap-results/zap-results.sarif.json"
          if not os.path.exists(path):
              raise SystemExit(0)

          with open(path) as f:
              sarif = json.load(f)

          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  for location in result.get("locations", []):
                      artifact = location.get("physicalLocation", {}).get(
                          "artifactLocation", {}
                      )
                      uri = artifact.get("uri", "")
                      if uri.startswith("http://") or uri.startswith("https://"):
                          parsed_path = urlparse(uri).path or "/"
                          slug = (
                              "index"
                              if parsed_path == "/"
                              else parsed_path.lstrip("/")
                          )
                          artifact["uri"] = f"zap-findings/{slug}"

          with open(path, "w") as f:
              json.dump(sarif, f)
          PY
      - name: Upload ZAP SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          # The sarif-json template appends its own .json extension to
          # reportFile ("zap-results.sarif" -> "zap-results.sarif.json"),
          # confirmed by the NoSuchFileException path seen when this job failed.
          sarif_file: zap-results/zap-results.sarif.json
          category: zap
