name: Web Audit

# Lighthouse, Pa11y and ZAP against an ephemeral stack built from main's
# images, each in its own job so one failing never hides the others' results.
# Weekly plus on demand: ~40 minutes of audits isn't worth it per merge.
#
# Advisory: findings never turn the run red. They go to Code Scanning (Pa11y,
# ZAP) and the run's artifacts (Lighthouse), and the notify job says on ntfy
# which audits found something past their threshold.
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-audit
  cancel-in-progress: true

# docker/docker-compose.yml's `:?` interpolation needs these on every
# `docker compose` call, `down` and `logs` included. Throwaway, CI-only
# values: the stack never sees real traffic and goes with the job.
env:
  POSTGRES_PASSWORD: ci-audit-postgres-password
  JWT_ACCESS_SECRET: ci-audit-access-secret
  JWT_REFRESH_SECRET: ci-audit-refresh-secret
  BACKUP_ENCRYPTION_PUBLIC_KEY: ci-audit-unused-backup-key

jobs:
  # Three pages of the public site and a dozen screens of the app (one per
  # kind), signed in as the seed's alice, mobile and desktop, median of
  # three runs. Thresholds in .github/lighthouse/lighthouserc.cjs.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.assert.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: stack
        uses: ./.github/actions/audit-stack
      - name: Lighthouse
        id: assert
        env:
          LIST_ID: ${{ steps.stack.outputs.list-id }}
        run: |
          config=.github/lighthouse/lighthouserc.cjs
          failed=()
          for form_factor in mobile desktop; do
            export LH_FORM_FACTOR=$form_factor
            rm -rf .lighthouseci
            LH_GROUP=public pnpm exec lhci collect --config=$config
            LH_GROUP=app pnpm exec lhci collect --config=$config --additive
            pnpm exec lhci assert --config=$config || failed+=("$form_factor")
            pnpm exec lhci upload --config=$config
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "findings=Lighthouse: thresholds missed (${failed[*]})" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-results/

  # Every page of apps/web (.github/web-audit/pages.mjs), signed out then
  # signed in as alice made admin, in light and dark at 375 and 1280 px.
  pa11y:
    name: Pa11y
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      findings: ${{ steps.pa11y.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: stack
        uses: ./.github/actions/audit-stack
        with:
          admin: true
      - name: Pa11y
        id: pa11y
        env:
          LIST_ID: ${{ steps.stack.outputs.list-id }}
        run: |
          failed=()
          for theme in light dark; do
            for width in 375 1280; do
              variant="$theme-$width"
              echo "::group::$variant"
              node .github/pa11y/build-config.mjs "$theme" "$width" > "$RUNNER_TEMP/pa11y-$variant.json"
              PA11Y_VARIANT=$variant npx --yes pa11y-ci@4.1.1 --config "$RUNNER_TEMP/pa11y-$variant.json" \
                || failed+=("$variant")
              echo "::endgroup::"
            done
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "findings=Pa11y: errors in ${failed[*]}" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Pa11y SARIF
        if: always() && hashFiles('pa11y-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: pa11y-results.sarif
          category: pa11y

  # The API scan imports apps/api/openapi.json, made by the reusable job
  # against its own Postgres and cached by source hash.
  openapi-artifact:
    uses: ./.github/workflows/generate-openapi-artifact.yml

  zap:
    name: OWASP ZAP
    needs: openapi-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      findings: ${{ steps.high.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Against the ephemeral stack, never https://loomkeep.app: the active
      # scan sends real attack payloads, write endpoints included.
      - uses: ./.github/actions/audit-stack
      - name: Download OpenAPI document
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-json
          path: apps/api

      # The report job's reportDir (.github/zap/plan*.yml) isn't created
      # automatically by the automation framework — without this the report
      # job fails with NoSuchFileException. `chmod` matters too: the ZAP
      # container runs as its own internal user and writes into this
      # directory over the bind mount — action-af's own `chmod a+w` only
      # touches the workspace root, not a subdirectory created before it
      # runs, so without this the container hits AccessDeniedException
      # trying to write the report into a dir it doesn't own.
      - run: mkdir -p zap-results && chmod a+w zap-results
      # continue-on-error: the framework exits 2 on a plan warning (the
      # OpenAPI import skipping an operation, say), not only on a finding.
      # What counts is the High alerts check below.
      - name: Run ZAP (web)
        continue-on-error: true
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d # v0.3.0
        with:
          plan: .github/zap/plan.yml
      - name: Run ZAP (api)
        continue-on-error: true
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d # v0.3.0
        with:
          plan: .github/zap/plan-api.yml

      # Code Scanning's upload-sarif step always sends a file:// checkoutURI
      # and rejects the whole upload if any result location is absolute
      # with a different scheme — the sarif-json template's locations are
      # the scanned page's own http(s):// URL (see ZAP's own docs example),
      # so without this every ZAP finding fails to upload with "SARIF URI
      # scheme http did not match the checkout URI scheme file". Writes to
      # *new* files rather than overwriting the *-results.sarif.json files
      # in place: those were created by the ZAP container's own user over
      # the bind mount, so they're readable but not writable by the runner
      # user this step runs as (PermissionError on open(..., "w")).
      - name: Rewrite ZAP SARIF locations for Code Scanning
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          for src, dst in [
              ("zap-results/zap-results.sarif.json", "zap-results/zap-results.fixed.sarif.json"),
              ("zap-results/zap-api-results.sarif.json", "zap-results/zap-api-results.fixed.sarif.json"),
          ]:
              if not os.path.exists(src):
                  continue

              with open(src) as f:
                  sarif = json.load(f)

              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      for location in result.get("locations", []):
                          artifact = location.get("physicalLocation", {}).get(
                              "artifactLocation", {}
                          )
                          uri = artifact.get("uri", "")
                          if uri.startswith("http://") or uri.startswith("https://"):
                              parsed_path = urlparse(uri).path or "/"
                              slug = (
                                  "index"
                                  if parsed_path == "/"
                                  else parsed_path.lstrip("/")
                              )
                              artifact["uri"] = f"zap-findings/{slug}"

              with open(dst, "w") as f:
                  json.dump(sarif, f)
          PY
      # ZAP's SARIF gives High-risk alerts the `error` level.
      - name: Count High alerts
        id: high
        if: always()
        run: |
          high=0
          for sarif in zap-results/*.fixed.sarif.json; do
            [ -e "$sarif" ] || continue
            count=$(jq '[.runs[].results[] | select(.level == "error")] | length' "$sarif")
            high=$((high + count))
          done
          if [ ! -e zap-results/zap-results.fixed.sarif.json ] || [ ! -e zap-results/zap-api-results.fixed.sarif.json ]; then
            echo "findings=ZAP: a scan produced no report" >> "$GITHUB_OUTPUT"
          elif [ "$high" -gt 0 ]; then
            echo "findings=ZAP: $high High alert(s)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload ZAP SARIF (web)
        if: always() && hashFiles('zap-results/zap-results.fixed.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zap-results/zap-results.fixed.sarif.json
          category: zap
      - name: Upload ZAP SARIF (api)
        if: always() && hashFiles('zap-results/zap-api-results.fixed.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zap-results/zap-api-results.fixed.sarif.json
          category: zap-api

  # One ntfy message listing what the audits found, or which of them broke:
  # with nothing turning the run red, this is how anyone hears of it.
  notify:
    needs: [lighthouse, pa11y, zap]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on ntfy
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINDINGS: |
            ${{ needs.lighthouse.outputs.findings }}
            ${{ needs.pa11y.outputs.findings }}
            ${{ needs.zap.outputs.findings }}
            ${{ needs.lighthouse.result != 'success' && format('Lighthouse job: {0}', needs.lighthouse.result) || '' }}
            ${{ needs.pa11y.result != 'success' && format('Pa11y job: {0}', needs.pa11y.result) || '' }}
            ${{ needs.zap.result != 'success' && format('ZAP job: {0}', needs.zap.result) || '' }}
        run: |
          [ -n "$NTFY_TOPIC_URL" ] || exit 0
          message=$(printf '%s\n' "$FINDINGS" | sed '/^[[:space:]]*$/d')
          [ -n "$message" ] || exit 0
          curl --fail --silent --show-error \
            -H "Title: Web audit: findings past threshold" \
            -H "Priority: default" \
            -H "Tags: mag" \
            -H "Click: $RUN_URL" \
            -d "$message" \
            "$NTFY_TOPIC_URL"
