name: Trivy

# Rescans `edge` (main, what's in production) weekly, to catch new CVEs in
# an unchanged base image. Each main commit's images are scanned by ci.yml's
# scan-images job once pushed, a PR's by docker-build-images; all three
# upload to the same trivy-api/trivy-web categories.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: trivy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      matrix:
        name: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # GHCR image paths must be lowercase; github.repository_owner
      # preserves the account's actual casing (Logan2234).
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Trivy pulls the image with the credentials docker login stores.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/loomkeep-${{ matrix.name }}:edge
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          # Advisory only, same as codeql.yml — findings land in the
          # Security tab rather than failing anything.
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
