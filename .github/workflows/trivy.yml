name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Same cadence as codeql.yml: catches new CVEs in unchanged base images,
    # not just ones introduced by a code change.
    - cron: "17 4 * * 1"

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level default, in case a future job here doesn't declare its own
# block — the scan job below still sets the elevated scope it needs.
permissions:
  contents: read

jobs:
  # apps/web/Dockerfile needs a static apps/api/openapi.json to generate its
  # typed API client from (no live API reachable from inside `docker build`)
  # — see ci.yml's identical need for the full reasoning. Shared with ci.yml
  # as a reusable workflow rather than duplicated, since both need it as-is.
  openapi-artifact:
    uses: ./.github/workflows/generate-openapi-artifact.yml

  scan:
    needs: openapi-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download OpenAPI document
        if: matrix.name == 'web'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-json
          path: apps/api
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: loomkeep-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loomkeep-${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          # Advisory only, same as codeql.yml — findings land in the
          # Security tab rather than blocking the build.
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
