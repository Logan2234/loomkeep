name: Trivy

# Scans the api/web images CI already pushed to GHCR rather than building
# its own: after every CI run on main (the exact SHA-tagged images the
# deploy pulls), and weekly on `latest` — what's in production — to catch
# new CVEs in an unchanged base image. PRs are scanned by ci.yml's
# docker-build-images job, on the image it builds anyway; both upload to the
# same trivy-api/trivy-web categories, so code scanning's PR check compares
# a PR's alerts with main's.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # A failed CI run may not have pushed both images.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      matrix:
        name: [api, web]
    steps:
      # At the commit CI built, so `git rev-parse --short` yields the same
      # tag docker-push gave the images (same shallow checkout there).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        # GHCR image paths must be lowercase; github.repository_owner
        # preserves the account's actual casing (Logan2234).
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Trivy pulls the image with the credentials docker login stores.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/loomkeep-${{ matrix.name }}:${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          # Advisory only, same as codeql.yml — findings land in the
          # Security tab rather than failing anything.
          exit-code: "0"
      # Pinned to the scanned commit on main: a workflow_run's own
      # GITHUB_SHA is main's tip when it starts, which may already be newer.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
          ref: refs/heads/main
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
