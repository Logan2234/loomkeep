name: Release

# One GitHub release per version, `v1.12.0`, created once the commit that
# bumps the root package.json version (the version-bump skill's PR) has
# passed CI on main. Its notes are that version's CHANGELOG.md section.
# The same run of CI already tagged the images `1.12.0`, `1.12`, `1` and
# `latest` (ci.yml's docker-tag), and mobile.yml attaches the APK to this
# release once it exists, then marks it the latest release.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    # Files are read through the API at that commit rather than checked out:
    # nothing here runs the repository's code.
    steps:
      - name: Create the release when this commit bumps the version
        run: |
          read_file() {
            gh api "repos/$GH_REPO/contents/$1?ref=$2" --jq .content | base64 -d
          }
          version=$(read_file package.json "$SHA" | jq -r .version)
          parent=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.parents[0].sha')
          previous=$(read_file package.json "$parent" | jq -r .version)
          if [ "$version" = "$previous" ]; then
            echo "No version change in ${SHA::7}: nothing to release."
            exit 0
          fi
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already exists."
            exit 0
          fi
          read_file CHANGELOG.md "$SHA" > CHANGELOG.md
          heading=$(grep -m1 "^## $version " CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## $version …' section."
            exit 1
          fi
          awk -v h="$heading" '$0 == h {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          title="Loomkeep ${heading#\#\# }"
          # Not `latest` yet: mobile.yml makes it so once the APK is attached,
          # or releases/latest/download/loomkeep-android.apk would 404 meanwhile.
          gh release create "$tag" \
            --target "$SHA" \
            --title "$title" \
            --notes-file notes.md \
            --latest=false
