name: Mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Debug build of the Android shell (docs/mobile-app-plan.md, MOB-01). The
  # APK is kept as a run artifact so it can be sideloaded on a phone, then
  # smoke-tested on an emulator; signing and store builds come with MOB-10.
  android-debug:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Whole workspace: the Capacitor CLI compiles capacitor.config.ts with
      # the root's TypeScript.
      - run: pnpm install --frozen-lockfile
      # Before cap sync: without it, capacitor.config.ts leaves push out.
      - name: Restore Firebase's config
        if: env.GOOGLE_SERVICES != ''
        run: echo "$GOOGLE_SERVICES" | base64 -d > apps/mobile/android/app/google-services.json
      - run: pnpm --filter @loomkeep/mobile exec cap sync android
      # Without it each run signs with a fresh key: a new APK won't install
      # over the previous one, and the App Links fingerprint (ANDROID_APP_LINKS)
      # goes stale. build.gradle reads its path from LOOMKEEP_DEBUG_KEYSTORE.
      - name: Restore the shared debug signing key
        if: env.DEBUG_KEYSTORE != ''
        run: |
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "LOOMKEEP_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      # A step that "restored" the key while Gradle signed with another one
      # once went unnoticed through several builds: compare the APK's
      # certificate with the shared key's.
      - name: Check the APK carries the shared debug key
        if: env.DEBUG_KEYSTORE != ''
        run: |
          expected=$(keytool -list -v -keystore "$LOOMKEEP_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey \
            | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^.*SHA-256 digest: //p')
          echo "Shared key: $expected"
          echo "APK signed with: $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loomkeep-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # GitHub's Linux runners have KVM, but the runner user can't open it
      # until this rule lets it: without it the emulator would crawl.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The page comes from loomkeep.app itself, so this checks the APK
      # against what's deployed: the bridge reaching the remote page, the
      # plugins, the shortcuts, an App Link, no crash.
      - name: Smoke test on an emulator
        env:
          PUSH_EXPECTED: ${{ env.GOOGLE_SERVICES != '' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/mobile/scripts/smoke-test.sh

  # Main's APK as a GitHub pre-release, for Obtainium on the phone to notice
  # and install over the previous one (same debug key, so the session
  # stays). One release per build, since Obtainium spots an update by a new
  # tag; only the three latest are kept. Main only, once the smoke test
  # passed: a PR's APK stays a run artifact.
  publish-dev-apk:
    needs: android-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loomkeep-android-debug
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-dev-${{ github.run_number }}
        run: |
          mv app-debug.apk loomkeep-dev.apk
          gh release create "$TAG" loomkeep-dev.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android dev build ${GITHUB_SHA::7}" \
            --notes "Debug build of main at ${GITHUB_SHA::7} (\"Loomkeep Dev\", app.loomkeep.debug), for testing: not a supported release."
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^android-dev-' | tail -n +4 \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
