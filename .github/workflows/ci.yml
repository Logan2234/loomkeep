name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A PR's newer push replaces its older run. On main every commit gets its own
# run, never cancelled: a cancelled run used to leave its commit without
# images, deploy or release (1.12.0's bump went that way). The deploy job
# keeps its own queue below.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; the jobs that push images, create releases or sign
# APKs ask for more themselves.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      # Whether lint-test-web/lint-test-api/knip have anything relevant to
      # check: either
      # app code, or a root file that changes what/how they check it
      # (shared eslint config, shared tsconfig, root package.json, or this
      # workflow itself).
      lint: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.root == 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
      # Also on every main commit while the version's release isn't
      # published: publish-release-apk needs this run's APK to publish it.
      mobile: ${{ steps.filter.outputs.mobile == 'true' || steps.release.outputs.pending == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # A draft is invisible to this job's read-only token, so a missing
      # release and a draft both read as pending.
      - id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -r .version package.json)"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null)" != false ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            root:
              - 'eslint.config.base.mjs'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            docker:
              - 'docker/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'

  # docker/ is deployed as is by the deploy job once CI on main is green, and no
  # other job looks at it: a Caddyfile or compose typo would otherwise reach
  # the VPS and take the whole site down, maintenance page included (Caddy
  # serves it). Checks the base file alone, base + prod, and base + prod +
  # each add-on — the combinations COMPOSE_FILE is built from — and the
  # Caddyfile with every add-on site file it can import. The values below
  # only satisfy the `:?` guards; nothing is started.
  docker-config:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ci
      JWT_ACCESS_SECRET: ci
      JWT_REFRESH_SECRET: ci
      MFA_ENCRYPTION_KEY: ci
      BACKUP_ENCRYPTION_PUBLIC_KEY: age1ci
      DOMAIN: loomkeep.example
      CLOUDFLARE_TUNNEL_TOKEN: ci
      GLITCHTIP_SECRET_KEY: ci
      GRAFANA_ADMIN_PASSWORD: ci
      PUBLIC_UNLEASH_FRONTEND_TOKEN: ci
      UMAMI_APP_SECRET: ci
      UNLEASH_ADMIN_PASSWORD: ci
      UNLEASH_API_TOKEN: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose files
        working-directory: docker
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          for addon in docker-compose.*.yml; do
            case "$addon" in docker-compose.prod.yml|docker-compose.ci.yml) continue ;; esac
            echo "::group::$addon"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f "$addon" config -q
            echo "::endgroup::"
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
      - name: Caddyfile
        run: |
          mounts=(-v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro")
          while IFS= read -r site; do
            mounts+=(-v "$PWD/$site:/etc/caddy/sites-enabled/$(basename "$site"):ro")
          done < <(find docker -name '*.caddy')
          # The production image, so a Dependabot bump of it is validated too.
          caddy_image=$(grep -oP 'image: \Kcaddy:\S+' docker/docker-compose.prod.yml)
          docker run --rm "${mounts[@]}" \
            -e SITE_ADDRESS=loomkeep.example \
            -e AUTHELIA_SITE_ADDRESS=auth.loomkeep.example \
            -e GLITCHTIP_SITE_ADDRESS=errors.loomkeep.example \
            -e GRAFANA_SITE_ADDRESS=grafana.loomkeep.example \
            -e HOMEPAGE_SITE_ADDRESS=home.loomkeep.example \
            -e PORTAINER_SITE_ADDRESS=portainer.loomkeep.example \
            -e QUACKBACK_SITE_ADDRESS=feedback.loomkeep.example \
            -e QUACKBACK_APP_PORT=3000 \
            -e UMAMI_SITE_ADDRESS=stats.loomkeep.example \
            -e UNLEASH_SITE_ADDRESS=flags.loomkeep.example \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Web and API run in parallel; packages/shared is TS-only and rides with API.
  lint-test-web:
    needs: [changes, openapi-artifact]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Generate Paraglide types
        run: pnpm --filter @loomkeep/web generate:paraglide
      # The typed API client (apps/web/src/lib/api/generated/schema.d.ts) is
      # generated, not committed (see .gitignore) — its one input is the
      # OpenAPI document that openapi-artifact already produced, so this job
      # only turns that into types instead of regenerating the document
      # itself (which needs the compiled app to boot far enough to build,
      # Prisma connecting on module init — no Postgres needed here).
      - name: Download OpenAPI document
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-json
          path: apps/api
      - name: Generate typed API client
        run: pnpm --filter @loomkeep/web generate:api-types
      # Installed here rather than kept as a permanent devDependency: it's
      # only ever invoked via --format in this one step, and knip has no way
      # to see that CLI-flag usage, so a committed devDependency just sits
      # there flagged as unused everywhere else in the repo.
      - name: Install ESLint SARIF formatter
        run: pnpm add --save-dev --workspace-root @microsoft/eslint-formatter-sarif@3.1.0
      - name: ESLint
        run: pnpm --filter @loomkeep/web lint --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
      # See the script's own docstring: drops results ESLint already
      # suppressed in-source, which the formatter reports anyway.
      - name: Strip suppressed ESLint results
        run: python3 .github/eslint/strip-suppressed.py apps/web/eslint-results.sarif
      - name: svelte-check
        run: pnpm --filter @loomkeep/web check
      - name: Web unit + component tests (with coverage)
        run: pnpm --filter @loomkeep/web test:cov
      - name: upload unit coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: apps/web/coverage/lcov.info
          flags: web-unit
          fail_ci_if_error: false
      - name: Web production build
        run: pnpm --filter @loomkeep/web build
      - name: Web production server regression tests
        run: pnpm --filter @loomkeep/web test:build
      - name: Upload ESLint Web results
        # Publishing the report to code scanning can fail on GitHub's side
        # ("Unexpected end of JSON input" once held up a deploy): the lint
        # itself already passed or failed in its own step.
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: apps/web/eslint-results.sarif
          category: eslint-web

  lint-test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install ESLint SARIF formatter
        run: pnpm add --save-dev --workspace-root @microsoft/eslint-formatter-sarif@3.1.0
      # Type-aware only here, never in the local hooks: building the type
      # graph roughly doubles ESLint (31s -> 55s on apps/api), which is
      # noise inside a 2-minute CI job and friction on every commit. Not
      # extended to apps/web — svelte-eslint-parser with a type graph runs
      # for tens of minutes there, so that side keeps the syntactic rules.
      - name: ESLint
        env:
          ESLINT_TYPE_AWARE: "true"
        run: pnpm --filter @loomkeep/api --filter @loomkeep/shared lint --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
      # See the script's own docstring: drops results ESLint already
      # suppressed in-source, which the formatter reports anyway.
      - name: Strip suppressed ESLint results
        run: python3 .github/eslint/strip-suppressed.py apps/api/eslint-results.sarif packages/shared/eslint-results.sarif
      - name: Generate Prisma client
        run: pnpm --filter @loomkeep/api exec prisma generate
      # docs/erd.md is generated and uncommitted; publish it as an artifact.
      - name: Upload ERD
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erd
          path: docs/erd.md
      - name: api unit tests (with coverage)
        run: pnpm --filter @loomkeep/api test:cov
      - name: upload unit coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: apps/api/coverage/lcov.info
          flags: api-unit
          fail_ci_if_error: false
      # packages/shared rides with the api job rather than getting one of its
      # own: it is TS-only, its suite runs in under a second, and the `api`
      # paths filter above already fires on any change under packages/shared.
      - name: shared unit tests (with coverage)
        run: pnpm --filter @loomkeep/shared test:cov
      - name: upload shared coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: packages/shared/coverage/lcov.info
          flags: shared-unit
          fail_ci_if_error: false
      - name: Upload ESLint API results
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: apps/api/eslint-results.sarif
          category: eslint-api
      - name: Upload ESLint Packages results
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: packages/shared/eslint-results.sarif
          category: eslint-packages

  e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loomkeep
          POSTGRES_PASSWORD: loomkeep
          POSTGRES_DB: loomkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://loomkeep:loomkeep@localhost:5432/loomkeep?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @loomkeep/api exec prisma generate
      - run: pnpm --filter @loomkeep/api test:e2e:cov
      - name: upload e2e coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: apps/api/coverage-e2e/lcov.info
          flags: api-e2e
          fail_ci_if_error: false

  knip:
    needs: [changes, openapi-artifact]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Builds packages/shared too: api/web import it through its dist/, so
      # without it knip can't resolve those imports and reports every exported
      # DTO in packages/shared as unused.
      - uses: ./.github/actions/setup
      - run: pnpm --filter @loomkeep/web generate:paraglide
      - name: Download OpenAPI document
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-json
          path: apps/api
      - name: Generate typed API client
        run: pnpm --filter @loomkeep/web generate:api-types
      - run: pnpm knip

  # Runs the prisma generate + API build + generate:openapi chain exactly
  # once, in its own Postgres-backed job, instead of every consumer repeating
  # it (Prisma connects on module init, hence Postgres). lint-test-web, knip,
  # and docker-build-images/docker-push below all just need the resulting
  # apps/api/openapi.json to turn into typed API client code — lint-test-web
  # and knip download it and run generate:api-types locally; the Docker jobs
  # hand it to the web image build (which runs in total isolation — no API,
  # no database reachable from inside `docker build`) as a build artifact,
  # and the web Dockerfile runs generate:api-types against that static file.
  # Must run whenever any of those three will: needs.changes.outputs.lint
  # (api/web/root) is the union of lint-test-web's and knip's own `if:`.
  openapi-artifact:
    needs: changes
    if: |
      needs.changes.outputs.lint == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/generate-openapi-artifact.yml

  # PR/manual-dispatch validation only — build without pushing, to catch a
  # broken Dockerfile before merge, then Trivy-scan the image just built.
  # Skipped on a push to main: docker-push below builds the same images
  # there (and pushes), and scan-images scans those pushed images afterwards.
  # The scan rides here rather than in its own job so a PR never builds an
  # image twice. Advisory (exit-code 0): what blocks a PR is code scanning's
  # own "Trivy" check, which compares the SARIF below with main's alerts in
  # the same category, so it can fail on alerts this PR introduces without
  # turning every PR red when a CVE lands in an unchanged base image.
  docker-build-images:
    needs: [changes, openapi-artifact]
    if: |
      always() &&
      (needs.openapi-artifact.result == 'success' || needs.openapi-artifact.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download OpenAPI document
        if: matrix.name == 'web' && needs.changes.outputs.web == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-json
          path: apps/api
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build ${{ matrix.name }} image
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: loomkeep-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: scan ${{ matrix.name }} image
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loomkeep-${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      # Same category as scan-images' scan of main, which is what lets code
      # scanning tell this PR's new alerts from the ones main already has.
      - name: upload ${{ matrix.name }} scan
        continue-on-error: true
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  # The status branch protection requires, and the reason the matrix above is
  # named `docker-build-images` rather than `docker-build`: a matrix job
  # reports one check per combination ("docker-build-images (api,
  # apps/api/Dockerfile)") and never one under its bare job name, except when
  # the whole job is skipped. A rule on the matrix job's own name is therefore
  # satisfied on a push to main (job skipped) but waits forever on any PR
  # where it actually runs, blocking auto-merge. This job carries the stable
  # `docker-build` name, always reports, and goes red when a leg does — the
  # failing leg stays individually visible as its own check.
  docker-build:
    needs: [docker-build-images, openapi-artifact]
    # always(), not !cancelled(): a cancelled build must still report here (as
    # a failure) rather than leave the status unreported.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `skipped` passes — a PR touching neither apps/api nor apps/web has no
      # image to build. Result is read through an `if:` rather than
      # interpolated into a shell script. openapi-artifact failing outright
      # (not just being skipped as not-needed) has to fail this check too:
      # docker-build-images' own `if:` treats that as "skip", which would
      # otherwise read as green here.
      - if: |
          (needs.docker-build-images.result != 'success' && needs.docker-build-images.result != 'skipped') ||
          needs.openapi-artifact.result == 'failure' ||
          needs.openapi-artifact.result == 'cancelled'
        run: exit 1

  # Pushes to GHCR so the deploy job (and self-hosters) can `pull` a pre-built
  # image instead of building on the target machine. Runs unconditionally
  # on every push to main (not gated on the `changes` filter like
  # docker-build-images above) so a SHA-tagged pair of images always exists for
  # whatever commit the deploy is about to check out — a push that only
  # touched apps/api must still produce a web image at that SHA, otherwise
  # `docker compose pull` on the VPS would have nothing to fetch.
  #
  # Each image is built once per platform, each on a runner of that
  # architecture (GitHub's arm64 runners are free for public repositories),
  # and pushed untagged, by digest; docker-tag below then puts both under
  # the same tags. No QEMU: emulated arm64 builds crashed in the api's
  # `prisma generate`, so the api had no arm64 image at all, and a native
  # build also gets the right binaries for sharp and Prisma's engines.
  docker-push:
    # Plain `needs`, not `always()`: both images stay in lockstep (see
    # above), so a failed artifact should block pushing either.
    needs: openapi-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # arm64 serves Raspberry Pis, ARM NAS models and ARM servers, not the
    # hosted instance: its failure leaves amd64 tagged and the deploy going.
    continue-on-error: ${{ matrix.platform == 'arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [api, web]
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download OpenAPI document
        if: matrix.name == 'web'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-json
          path: apps/api
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        # GHCR image paths must be lowercase; github.repository_owner
        # preserves the account's actual casing (Logan2234).
        run: |
          echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: build and push the ${{ matrix.platform }} ${{ matrix.name }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.name }}/Dockerfile
          platforms: linux/${{ matrix.platform }}
          # Only the api Dockerfile declares a GIT_SHA ARG (see its
          # ARG GIT_SHA=unknown) — passing it for web too would just be an
          # unused build-arg warning.
          build-args: ${{ matrix.name == 'api' && format('GIT_SHA={0}', steps.vars.outputs.short) || '' }}
          outputs: type=image,name=ghcr.io/${{ steps.vars.outputs.owner }}/loomkeep-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.platform }}
      - name: Hand the digest to docker-tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags each image from its platform digests (amd64 always, arm64 when its
  # build succeeded):
  # - every commit: its 12-character SHA (what the deploy pulls) and `edge`;
  # - the first commit built at a new root package.json version (the bump,
  #   or the next one if its run never got this far): `1.12.0`, `1.12`, `1`
  #   and `latest`, so `latest` is the last release, the one self-hosters get
  #   by default.
  docker-tag:
    needs: docker-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        # GHCR image paths must be lowercase; github.repository_owner
        # preserves the account's actual casing (Logan2234).
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loomkeep-${{ matrix.name }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          version=$(jq -r .version package.json)
          if ! docker buildx imagetools inspect "$image:$version" > /dev/null 2>&1; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=,format=short
            type=edge,branch=main
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' }}
      - name: tag the ${{ matrix.name }} image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA:0:12}"

  # The SHA-tagged images the deploy pulls, scanned once pushed; trivy.yml
  # rescans `edge` weekly, for new CVEs in an unchanged base image. PRs are
  # scanned by docker-build-images, on the image it builds anyway: both upload
  # to the same trivy-api/trivy-web categories, so code scanning's PR check
  # compares a PR's alerts with main's. Advisory only (exit-code 0).
  scan-images:
    needs: docker-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      matrix:
        name: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Trivy pulls the image with the credentials docker login stores.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loomkeep-${{ matrix.name }}:${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  # What everything shipped from main waits for: every check that ran passed
  # and both images are tagged. Skipped checks (nothing of theirs changed)
  # pass; the Android jobs don't count, they never block the web.
  ready-to-ship:
    needs: [docker-config, lint-test-web, lint-test-api, e2e, knip, docker-tag]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          needs.docker-tag.result != 'success'
        run: exit 1

  deploy:
    needs: ready-to-ship
    # A job's default success() also requires every job further up its
    # needs chain to have succeeded, so a check skipped for want of changes
    # (lint-test-api on a web-only commit) would skip it: ready-to-ship's own
    # result is what counts.
    if: ${{ !cancelled() && needs.ready-to-ship.result == 'success' }}
    runs-on: ubuntu-latest
    # The VPS_* secrets live in this environment, limited to main, so no
    # other branch's workflow can read them; it also records each deploy.
    environment: production
    # One deploy at a time; a newer commit's replaces one still queued.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      superseded: ${{ steps.head.outputs.superseded }}
    steps:
      # Runs no longer cancel each other on main, so an older commit's run can
      # finish after a newer one's: deploying it then would roll production
      # back. The newer commit's own run deploys instead.
      - name: Is this still main's head?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to ${head::7}, whose run deploys instead."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: steps.head.outputs.superseded != 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The host key the runner must find (`SHA256:…`, from
          # `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the VPS):
          # without it, a hijacked DNS or route gets the key and the script.
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          # Deploys the exact commit CI validated. The rest (pre-deploy dump,
          # start, health wait, rollback) is the checked-out commit's own
          # .github/deploy/vps-deploy.sh.
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            DEPLOY_SHA="$DEPLOY_SHA" bash .github/deploy/vps-deploy.sh
      # The healthchecks above run inside the containers: a broken Caddy
      # route, certificate or Cloudflare rule would still pass them. This
      # goes through the same path as a visitor; a failure fails the job,
      # so the ntfy alert below fires.
      - name: Check the public site
        if: steps.head.outputs.superseded != 'true'
        run: |
          for url in https://loomkeep.app/ https://loomkeep.app/api/health; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 6 --retry-all-errors --max-time 15 "$url"
            echo "$url answers"
          done

  # Says how it went on ntfy (NTFY_TOPIC_URL: the topic's full URL, e.g.
  # https://ntfy.sh/<unguessable name>, which is all it takes to post or
  # read): a skipped deploy otherwise goes unnoticed, as #433 and #438 did.
  notify:
    needs: [ready-to-ship, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/deploy
      - name: Notify on ntfy
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          CI_RESULT: ${{ needs.ready-to-ship.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SUPERSEDED: ${{ needs.deploy.outputs.superseded }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          export MAIN_SHA
          bash .github/deploy/notify.sh

  # One GitHub release per version, `v1.12.0`, notes from that version's
  # CHANGELOG.md section, created by the first commit that passes on main at
  # a version with no release yet: the version-bump skill's PR, or the next
  # commit if its run never got this far. docker-tag above tagged the images
  # in the same run. It starts as a draft: the repository's releases are
  # immutable, so a published one takes no more assets (1.12.0 got no APK
  # that way). publish-release-apk attaches the APK, then publishes it as
  # the latest one.
  release:
    needs: ready-to-ship
    # See deploy.
    if: ${{ !cancelled() && needs.ready-to-ship.result == 'success' }}
    runs-on: ubuntu-latest
    # Unlike published ones, two drafts can share a tag: one run at a time
    # sees the other's.
    concurrency:
      group: github-release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            package.json
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Create the version's draft release if it doesn't exist yet
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null); then
            echo "$tag already exists (draft: $draft)."
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heading=$(grep -m1 "^## ${tag#v} " CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## ${tag#v} …' section."
            exit 1
          fi
          awk -v h="$heading" '$0 == h {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          # The tag only exists once publish-release-apk publishes it.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Loomkeep ${heading#\#\# }" \
            --notes-file notes.md \
            --draft
          echo "draft=true" >> "$GITHUB_OUTPUT"

  # Debug build of the Android shell (docs/mobile-app-plan.md, MOB-01). The
  # APK is kept as a run artifact so it can be sideloaded on a phone, then
  # smoke-tested on an emulator; the release build rides along (MOB-23).
  android-debug:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    outputs:
      release-apk: ${{ steps.release-apk.outcome }}
    env:
      DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      LOOMKEEP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # gradle-wrapper.jar is the one binary in the repository, and the build
      # runs it: this checks it against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Whole workspace: the Capacitor CLI compiles capacitor.config.ts with
      # the root's TypeScript.
      - uses: ./.github/actions/setup
        with:
          build-shared: false
      - name: Error page tests
        run: pnpm --filter @loomkeep/mobile test
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Before cap sync: without it, capacitor.config.ts leaves push out.
      - name: Restore Firebase's config
        if: env.GOOGLE_SERVICES != ''
        run: echo "$GOOGLE_SERVICES" | base64 -d > apps/mobile/android/app/google-services.json
      - run: pnpm --filter @loomkeep/mobile exec cap sync android
      # Without it each run signs with a fresh key: a new APK won't install
      # over the previous one, and the App Links fingerprint (ANDROID_APP_LINKS)
      # goes stale. build.gradle reads its path from LOOMKEEP_DEBUG_KEYSTORE.
      - name: Restore the shared debug signing key
        if: env.DEBUG_KEYSTORE != ''
        run: |
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "LOOMKEEP_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Check the APK carries the shared debug key
        if: env.DEBUG_KEYSTORE != ''
        run: >-
          bash apps/mobile/scripts/check-signature.sh
          apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          "$LOOMKEEP_DEBUG_KEYSTORE" android androiddebugkey
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loomkeep-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # The build GitHub releases publish (MOB-23), made on every run that
      # has the key so a PR proves it still builds and signs.
      - name: Restore the release signing key
        if: env.RELEASE_KEYSTORE != ''
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "LOOMKEEP_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      # The bundle is what Google Play takes (MOB-10), signed with the same
      # key so the Play and GitHub builds can update each other.
      - name: Build the release APK and Play bundle
        if: env.RELEASE_KEYSTORE != ''
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Check the release builds carry the release key
        if: env.RELEASE_KEYSTORE != ''
        run: |
          for build in apk/release/app-release.apk bundle/release/app-release.aab; do
            bash apps/mobile/scripts/check-signature.sh \
              "apps/mobile/android/app/build/outputs/$build" \
              "$LOOMKEEP_RELEASE_KEYSTORE" "$LOOMKEEP_RELEASE_KEYSTORE_PASSWORD" loomkeep
          done
      - id: release-apk
        if: env.RELEASE_KEYSTORE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loomkeep-android-release
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      # GitHub's Linux runners have KVM, but the runner user can't open it
      # until this rule lets it: without it the emulator would crawl.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator's system image is a ~1.5 GB download, which has come
      # down corrupted and failed the run; once cached, sdkmanager finds it
      # installed and skips it.
      - name: Cache the emulator's system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64
      # The page comes from loomkeep.app itself, so this checks the APK
      # against what's deployed: the bridge reaching the remote page, the
      # plugins, the shortcuts, an App Link, no crash.
      - name: Smoke test on an emulator
        env:
          PUSH_EXPECTED: ${{ env.GOOGLE_SERVICES != '' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # One retry: a deploy restarting the site mid-test (both follow a
          # push to main) showed the app's offline page instead of the login.
          script: bash apps/mobile/scripts/smoke-test.sh || (echo "Retrying once" && bash apps/mobile/scripts/smoke-test.sh)

  # Main's APK as a GitHub pre-release, for Obtainium on the phone to notice
  # and install over the previous one (same debug key, so the session
  # stays). One release per build, since Obtainium spots an update by a new
  # tag; only the three latest are kept. Main only, once the smoke test
  # passed: a PR's APK stays a run artifact.
  publish-dev-apk:
    needs: android-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the build's provenance with GitHub's OIDC identity (Sigstore).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: apps/mobile/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loomkeep-android-debug
      - run: mv app-debug.apk loomkeep-dev.apk
      # Proves the APK came from this workflow at this commit; the bundle is
      # attached so `gh attestation verify` works offline too.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: loomkeep-dev.apk
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-dev-${{ github.run_number }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The title reads like the stable releases', with the version this
        # build leads to and its build number, so the list sorts and scans.
        run: |
          version=$(jq -r .version apps/mobile/package.json)
          cp "$BUNDLE" loomkeep-dev.apk.sigstore.json
          gh release create "$TAG" loomkeep-dev.apk loomkeep-dev.apk.sigstore.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Loomkeep Android $version-dev.${{ github.run_number }}" \
            --notes "Debug build of main at ${GITHUB_SHA::7} (\"Loomkeep Dev\", app.loomkeep.debug), for testing: not a supported release."
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^android-dev-' | tail -n +4 \
            | xargs -r -n1 gh release delete --cleanup-tag --yes

  # The app users install (MOB-23), attached to its version's draft release
  # (`v1.12.0`, created by the release job) by the first main build that
  # finds it still a draft, usually the bump commit's own, which then
  # publishes it. The asset keeps one name, so
  # releases/latest/download/loomkeep-android.apk (the landing's and the
  # docs' link) always serves the newest.
  publish-release-apk:
    needs: [android-debug, release]
    # See deploy.
    if: >-
      !cancelled() && needs.release.result == 'success'
      && needs.release.outputs.draft == 'true'
      && needs.android-debug.outputs.release-apk == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: github-release-apk
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Another run may have published it while this one waited its turn.
      - name: Is the release still a draft?
        id: draft
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is already published."
          fi
      - if: steps.draft.outputs.draft
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loomkeep-android-release
      # The artifact keeps the build tree's paths below its common root.
      - if: steps.draft.outputs.draft
        run: |
          mv apk/release/app-release.apk loomkeep-android.apk
          mv bundle/release/app-release.aab loomkeep-android-play.aab
      - id: attest
        if: steps.draft.outputs.draft
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: loomkeep-android.apk
      - id: attest-bundle
        if: steps.draft.outputs.draft
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: loomkeep-android-play.aab
      # The bundle rides along for Google Play (MOB-10), uploaded by hand
      # from here; Obtainium only looks at APKs.
      - name: Attach the APK and the Play bundle, then publish the release
        if: steps.draft.outputs.draft
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          AAB_BUNDLE: ${{ steps.attest-bundle.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" loomkeep-android.apk.sigstore.json
          cp "$AAB_BUNDLE" loomkeep-android-play.aab.sigstore.json
          gh release upload "$TAG" loomkeep-android.apk loomkeep-android.apk.sigstore.json \
            loomkeep-android-play.aab loomkeep-android-play.aab.sigstore.json --clobber
          # Publishing makes the release immutable, and `latest` only now: a
          # latest release without its APK would answer the download link
          # above with a 404.
          gh release edit "$TAG" --draft=false --latest
