name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this workflow needs to write to the repo, comment on PRs, or
# touch packages — read-only is enough for checkout + Codecov's own token.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      # Whether lint-test-web/lint-test-api/knip have anything relevant to
      # check: either
      # app code, or a root file that changes what/how they check it
      # (shared eslint config, shared tsconfig, root package.json, or this
      # workflow itself).
      lint: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.root == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            root:
              - 'eslint.config.base.mjs'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.github/workflows/ci.yml'

  # Split web/api (mirroring the changes-filter split already used by
  # e2e/docker-build-images below) so the two run in parallel instead of one
  # long sequential job — Lighthouse alone used to take ~2.5min on top of
  # everything else. packages/shared is TS-only like the api, so its lint
  # runs alongside api's rather than web's.
  lint-test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # The typed API client (apps/web/src/lib/api/generated/schema.d.ts) is
    # generated, not committed (see .gitignore) — regenerating it needs the
    # API's OpenAPI document, which in turn needs the compiled app to boot
    # far enough to build (Prisma connects on module init), hence Postgres
    # here even though this job never runs API tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loomkeep
          POSTGRES_PASSWORD: loomkeep
          POSTGRES_DB: loomkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://loomkeep:loomkeep@localhost:5432/loomkeep?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - name: Generate Paraglide types
        run: pnpm --filter @loomkeep/web generate:paraglide
      - name: Generate typed API client
        run: |
          pnpm --filter @loomkeep/api exec prisma generate
          pnpm --filter @loomkeep/api build
          pnpm --filter @loomkeep/api generate:openapi
          pnpm --filter @loomkeep/web generate:api-types
      # Installed here rather than kept as a permanent devDependency: it's
      # only ever invoked via --format in this one step, and knip has no way
      # to see that CLI-flag usage, so a committed devDependency just sits
      # there flagged as unused everywhere else in the repo.
      - name: Install ESLint SARIF formatter
        run: pnpm add --save-dev --workspace-root @microsoft/eslint-formatter-sarif@3.1.0
      - name: ESLint
        run: pnpm --filter @loomkeep/web lint --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
      - name: svelte-check
        run: pnpm --filter @loomkeep/web check
      - name: Web unit tests (with coverage)
        run: pnpm --filter @loomkeep/web test:cov
      - name: upload unit coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web-unit
          fail_ci_if_error: false
      - name: Web production build
        run: pnpm --filter @loomkeep/web build
      - name: Lighthouse
        if: needs.changes.outputs.web == 'true'
        run: pnpm exec lhci autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse reports
        if: always() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: lighthouse-results/
      - name: Upload ESLint Web results
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: apps/web/eslint-results.sarif
          category: eslint-web

  lint-test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - name: Install ESLint SARIF formatter
        run: pnpm add --save-dev --workspace-root @microsoft/eslint-formatter-sarif@3.1.0
      - name: ESLint
        run: pnpm --filter @loomkeep/api --filter @loomkeep/shared lint --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
      - name: Generate Prisma client
        run: pnpm --filter @loomkeep/api exec prisma generate
      - name: api unit tests (with coverage)
        run: pnpm --filter @loomkeep/api test:cov
      - name: upload unit coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api-unit
          fail_ci_if_error: false
      - name: Upload ESLint API results
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: apps/api/eslint-results.sarif
          category: eslint-api
      - name: Upload ESLint Packages results
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: packages/shared/eslint-results.sarif
          category: eslint-packages

  e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loomkeep
          POSTGRES_PASSWORD: loomkeep
          POSTGRES_DB: loomkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://loomkeep:loomkeep@localhost:5432/loomkeep?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - run: pnpm --filter @loomkeep/api exec prisma generate
      - run: pnpm --filter @loomkeep/api test:e2e:cov
      - name: upload e2e coverage to Codecov
        background: true
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage-e2e/lcov.info
          flags: api-e2e
          fail_ci_if_error: false

  knip:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api/web import the shared package through its dist/, so without this
      # knip can't resolve those imports and reports every exported DTO in
      # packages/shared as unused.
      - run: pnpm build:package
      - run: pnpm --filter @loomkeep/web generate:paraglide
      - run: pnpm knip

  # apps/web's Docker build compiles apps/web in total isolation — no API,
  # no database reachable from inside `docker build` — so it can't run
  # generate:openapi itself the way lint-test-web does. This job produces
  # apps/api/openapi.json once (the one input generate:api-types needs) and
  # hands it to whichever web image build needs it as an artifact; the web
  # Dockerfile then runs generate:api-types against that static file, no
  # network access required during the image build itself.
  openapi-artifact:
    needs: changes
    if: |
      needs.changes.outputs.web == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loomkeep
          POSTGRES_PASSWORD: loomkeep
          POSTGRES_DB: loomkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://loomkeep:loomkeep@localhost:5432/loomkeep?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:package
      - run: pnpm --filter @loomkeep/api exec prisma generate
      - run: pnpm --filter @loomkeep/api build
      - run: pnpm --filter @loomkeep/api generate:openapi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-json
          path: apps/api/openapi.json
          retention-days: 1

  # PR/manual-dispatch validation only — build without pushing, to catch a
  # broken Dockerfile before merge. Skipped on a push to main: docker-push
  # below builds the same images there (and pushes), so running this too
  # would just build api/web a second time for nothing.
  docker-build-images:
    needs: [changes, openapi-artifact]
    if: |
      always() &&
      (needs.openapi-artifact.result == 'success' || needs.openapi-artifact.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download OpenAPI document
        if: matrix.name == 'web' && needs.changes.outputs.web == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: openapi-json
          path: apps/api
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: build ${{ matrix.name }} image
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The status branch protection requires, and the reason the matrix above is
  # named `docker-build-images` rather than `docker-build`: a matrix job
  # reports one check per combination ("docker-build-images (api,
  # apps/api/Dockerfile)") and never one under its bare job name, except when
  # the whole job is skipped. A rule on the matrix job's own name is therefore
  # satisfied on a push to main (job skipped) but waits forever on any PR
  # where it actually runs, blocking auto-merge. This job carries the stable
  # `docker-build` name, always reports, and goes red when a leg does — the
  # failing leg stays individually visible as its own check.
  docker-build:
    needs: [docker-build-images, openapi-artifact]
    # always(), not !cancelled(): a cancelled build must still report here (as
    # a failure) rather than leave the status unreported.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `skipped` passes — a PR touching neither apps/api nor apps/web has no
      # image to build. Result is read through an `if:` rather than
      # interpolated into a shell script. openapi-artifact failing outright
      # (not just being skipped as not-needed) has to fail this check too:
      # docker-build-images' own `if:` treats that as "skip", which would
      # otherwise read as green here.
      - if: |
          (needs.docker-build-images.result != 'success' && needs.docker-build-images.result != 'skipped') ||
          needs.openapi-artifact.result == 'failure' ||
          needs.openapi-artifact.result == 'cancelled'
        run: exit 1

  # Pushes to GHCR so deploy.yml (and self-hosters) can `pull` a pre-built
  # image instead of building on the target machine. Runs unconditionally
  # on every push to main (not gated on the `changes` filter like
  # docker-build-images above) so a SHA-tagged pair of images always exists for
  # whatever commit deploy.yml is about to check out — a push that only
  # touched apps/api must still produce a web image at that SHA, otherwise
  # `docker compose pull` on the VPS would have nothing to fetch. api/web
  # build on separate runners (matrix) rather than sequentially in one job.
  docker-push:
    # Depends on openapi-artifact (whose own `if:` already runs it on every
    # main push) via plain `needs`, not `always()`: unlike docker-build-images
    # above, both legs here are meant to stay in lockstep (see the comment
    # above this job), so a failed artifact should block pushing either image
    # rather than pushing a web image built without one.
    needs: openapi-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download OpenAPI document
        if: matrix.name == 'web'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: openapi-json
          path: apps/api
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        # GHCR image paths must be lowercase; github.repository_owner
        # preserves the account's actual casing (Logan2234).
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: build and push ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Only the api Dockerfile declares a GIT_SHA ARG (see its
          # ARG GIT_SHA=unknown) — passing it for web too would just be an
          # unused build-arg warning.
          build-args: ${{ matrix.name == 'api' && format('GIT_SHA={0}', steps.vars.outputs.short) || '' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/loomkeep-${{ matrix.name }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/loomkeep-${{ matrix.name }}:${{ steps.vars.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
