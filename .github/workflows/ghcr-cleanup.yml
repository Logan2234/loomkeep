name: GHCR cleanup

on:
  schedule:
    # Weekly is plenty: images only pile up one push to main at a time
    # (docker-push in ci.yml), never in bulk.
    - cron: "12 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Every push to main tags loomkeep-api and loomkeep-web with `latest`
      # and the commit's short SHA. Each tag is an index whose platform
      # images and provenance attestations show as "untagged" versions in
      # the package view: they belong to it and go when it goes.
      #
      # Kept: `latest`, `edge`, version tags (1.2.3, 1.2, 1), and the 30 newest SHA
      # tags, enough to pin or roll back to any recent deploy. Older SHA
      # tags, untagged leftovers and orphaned attestations are deleted.
      # GHCR has no built-in expiry for a personal-account package.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: loomkeep-api,loomkeep-web
          keep-n-tagged: 30
          # Wildcards, not a regex (the action rejects ReDoS-prone patterns):
          # `*.*` keeps 1.12.0 and 1.12, `?` and `??` the major-only 1 or 12.
          # A 12-character commit tag has no dot, so it matches none of them.
          exclude-tags: "latest,edge,*.*,?,??"
          delete-untagged: true
          delete-orphaned-images: true
          delete-partial-images: true
          registry-url: "https://ghcr.io"
