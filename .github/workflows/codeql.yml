name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level default, in case a future job here doesn't declare its own
# block — the analyze job below still sets the elevated scopes it needs.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # actions: the workflows themselves (script injection, untrusted
        # checkouts). java-kotlin: the Android shell. Kotlin (the widgets) is
        # only extracted from a real compilation, and Java without one misses
        # most of its dependencies, so this one builds below.
        language: [javascript-typescript, actions, java-kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup
        with:
          build-shared: false
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Without it src/push stays out of the build, so out of the analysis.
      - name: Restore Firebase's config
        if: matrix.language == 'java-kotlin' && env.GOOGLE_SERVICES != ''
        run: echo "$GOOGLE_SERVICES" | base64 -d > apps/mobile/android/app/google-services.json
      - if: matrix.language == 'java-kotlin'
        run: pnpm --filter @loomkeep/mobile exec cap sync android
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml
      # CodeQL traces the compilers this step starts: a Gradle or Kotlin daemon
      # would compile out of its sight.
      - name: Compile the Android app
        if: matrix.language == 'java-kotlin'
        working-directory: apps/mobile/android
        run: ./gradlew :app:compileDebugSources --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ matrix.language == 'java-kotlin' && 'never' || 'always' }}
          output: sarif
      # The build compiles Capacitor's Java too, and paths-ignore doesn't apply
      # to traced code. Its code is upstream's to fix. The two rules read fields
      # and variables Kotlin's compilers generate ($stable, tmp0_other_with_cast).
      - name: Keep only this repository's own findings
        if: matrix.language == 'java-kotlin'
        run: |
          jq '.runs[].results |= map(select(
            .locations[0].physicalLocation.artifactLocation.uri as $uri
            | ($uri | startswith("node_modules/") | not)
            and ((.ruleId == "java/field-masks-super-field" or .ruleId == "java/local-variable-is-never-read")
              and ($uri | endswith(".kt")) | not)
          ))' sarif/java.sarif > java-filtered.sarif
      - if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: java-filtered.sarif
          category: "/language:${{ matrix.language }}"
