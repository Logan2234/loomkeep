name: "Loomkeep CodeQL config"

queries:
  - uses: security-and-quality

paths-ignore:
  - apps/api/dist
  - apps/api/coverage
  - apps/web/build
  - apps/web/.svelte-kit
  - packages/shared/dist
# hibp.service.ts's SHA-1 is the HIBP range API's k-anonymity lookup key, not
# a credential hash: its js/insufficient-password-hash alert is dismissed as a
# false positive in code scanning, like the other files where that rule
# misfires, rather than hiding the whole file from every other query.
