version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types: ["minor", "patch"]
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types: ["minor", "patch"]
      svelte:
        patterns:
          - "svelte"
          - "@sveltejs/*"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      api-image:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      web-image:
        update-types: ["minor", "patch"]

  # Covers docker-compose.yml + every *.yml override in docker/
  # (prod/observability) — image: tags (postgres, caddy, loki,
  # promtail, grafana-oss...), not just the two Dockerfiles above.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      compose-images:
        update-types: ["minor", "patch"]
