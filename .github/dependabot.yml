version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    # A Capacitor major comes with `npx cap migrate` and native changes to
    # apps/mobile/android: done by hand, not merged from a PR.
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor-mlkit/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Core, CLI, Android platform and plugins move together, in apps/web
      # and apps/mobile alike (src/lib/native/plugins.spec.ts checks the two
      # agree): a partial bump would leave the APK and the web disagreeing.
      capacitor:
        patterns:
          - "@capacitor/*"
          - "@capacitor-mlkit/*"
        update-types: ["minor", "patch"]
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types: ["minor", "patch"]
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types: ["minor", "patch"]
      svelte:
        patterns:
          - "svelte"
          - "@sveltejs/*"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # The Android project's Gradle plugins and AndroidX libraries (versions
  # in build.gradle and variables.gradle) and the Gradle wrapper. Majors
  # stay with Capacitor's own upgrades.
  - package-ecosystem: "gradle"
    directory: "/apps/mobile/android"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "mobile"
    commit-message:
      prefix: "⚡"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      android:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      api-image:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      web-image:
        update-types: ["minor", "patch"]

  # Covers docker-compose.yml + every *.yml override in docker/
  # (prod/observability) — image: tags (postgres, caddy, loki,
  # promtail, grafana-oss...), not just the two Dockerfiles above.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "⚡"
    groups:
      compose-images:
        update-types: ["minor", "patch"]
