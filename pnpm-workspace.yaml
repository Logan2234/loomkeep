packages:
  - apps/*
  - packages/*
allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  # prisma-erd-generator pulls puppeteer, but the .md ERD target never launches
  # a browser, so we skip its Chromium download. @scarf/scarf is opt-in analytics.
  "@scarf/scarf": false
  # Only needed for source-map upload during build (not set up yet — see
  # docker-compose.glitchtip.yml's GlitchTip section, "not for now" call).
  "@sentry/cli": false
  prisma: true
  puppeteer: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@sveltejs/kit@2.69.0 || 2.69.2 || 2.70.1"
  - "@types/node@26.1.0"
  - vite@8.1.3
  - eslint-plugin-svelte@3.21.0
  - lint-staged@17.1.0
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-netbsd-x64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - typescript@7.0.2
  - cookie@0.7.0
  - multer@2.2.0
  - find-my-way@9.6.1
  - js-yaml@4.3.1 || 5.2.2
  - brace-expansion@1.1.17 || 1.1.18
  - "@nestjs/terminus@12.0.0"
  - "@sentry/core@10.73.0"
  - "@sentry/node-core@10.73.0"
  - "@sentry/node@10.73.0"
  - "@sentry/opentelemetry@10.73.0"
  - "@sentry/server-utils@10.73.0"
  - nestjs-pino@5.0.0
  - nodemailer@9.1.0 || 10.0.0
  - "@sentry/browser-utils@10.73.0"
  - "@sentry/browser@10.73.0"
  - "@sentry/cloudflare@10.73.0"
  - "@sentry/feedback@10.73.0"
  - "@sentry/replay-canvas@10.73.0"
  - "@sentry/replay@10.73.0"
  - "@sentry/svelte@10.73.0"
  - "@sentry/sveltekit@10.73.0"
  - "@typescript-eslint/eslint-plugin@8.69.0"
  - "@typescript-eslint/parser@8.69.0"
  - "@typescript-eslint/project-service@8.69.0"
  - "@typescript-eslint/scope-manager@8.69.0"
  - "@typescript-eslint/tsconfig-utils@8.69.0"
  - "@typescript-eslint/type-utils@8.69.0"
  - "@typescript-eslint/types@8.69.0"
  - "@typescript-eslint/typescript-estree@8.69.0"
  - "@typescript-eslint/utils@8.69.0"
  - "@typescript-eslint/visitor-keys@8.69.0"
  - typescript-eslint@8.69.0
  - "@swc/core-darwin-arm64@1.16.2"
  - "@swc/core-darwin-x64@1.16.2"
  - "@swc/core-linux-arm-gnueabihf@1.16.2"
  - "@swc/core-linux-arm64-gnu@1.16.2"
  - "@swc/core-linux-arm64-musl@1.16.2"
  - "@swc/core-linux-ppc64-gnu@1.16.2"
  - "@swc/core-linux-s390x-gnu@1.16.2"
  - "@swc/core-linux-x64-gnu@1.16.2"
  - "@swc/core-linux-x64-musl@1.16.2"
  - "@swc/core-win32-arm64-msvc@1.16.2"
  - "@swc/core-win32-ia32-msvc@1.16.2"
  - "@swc/core-win32-x64-msvc@1.16.2"
  - "@swc/core@1.16.2"
  - fastify@5.12.3
  - otpauth@9.5.2
  - eslint@10.10.0
overrides:
  cookie@<0.7.0: ^0.7.0
  mysql2@<3.22.0: ^3.22.0
  nanoid@<3.3.18: ^3.3.18
  # @nestjs/platform-fastify@12.0.1 resolves its own fastify range to 5.12.1
  # independently of the direct 5.12.3 dependency above, so TypeScript sees
  # two incompatible FastifyInstance types in main.ts. Force one version.
  fastify: ^5.12.3
  # Transitive-only vulnerable versions (dev tooling: ajv/prisma/lhci chains),
  # none reachable from user input — forced to the first patched release.
  fast-uri@3.1.5: ^3.1.6
  fast-uri@4.1.2: ^4.1.3
  deepmerge-ts@<8.0.0: ^8.0.0
  tmp@<0.2.6: ^0.2.6
  uuid@<11.1.1: ^11.1.1
