coverage:
  precision: 3
  round: down
  range: 60..100
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "flags, diff, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true

github_checks:
  annotations: true

codecov:
  require_ci_to_pass: false

# lint-test-api/lint-test-web/e2e (ci.yml) only run when their paths-filter
# matched — a web-only PR never runs lint-test-api, for example. Without
# carryforward, that flag would show as 0%/missing on that PR instead of
# reusing its last known value.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: api-unit
      paths:
        - apps/api/
        - packages/shared/
    - name: api-e2e
      paths:
        - apps/api/
        - packages/shared/
    - name: web-unit
      paths:
        - apps/web/
        - packages/shared/
