coverage:
  precision: 3
  round: down
  range: 60..100
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, flags, diff, files, footer"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: false

codecov:
  require_ci_to_pass: false

# Test code is never covered code: a spec left in a coverage report shows as
# "missing lines" on the PR that adds it.
ignore:
  - "**/*.spec.ts"
  - "apps/api/test/**"

# lint-test-api/lint-test-web/e2e (ci.yml) only run when their paths-filter
# matched — a web-only PR never runs lint-test-api, for example. Without
# carryforward, that flag would show as 0%/missing on that PR instead of
# reusing its last known value.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: api-unit
      paths:
        - apps/api/
        - packages/shared/
    - name: api-e2e
      paths:
        - apps/api/
        - packages/shared/
    - name: web-unit
      paths:
        - apps/web/
        - packages/shared/
