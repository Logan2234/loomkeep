coverage:
  precision: 3
  round: down
  range: 60..100
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true

github_checks:
  annotations: true
