# Bound each service's Docker log driver so a chatty container can't slowly
# fill the disk (Observability Palier 1). Palier 2 (Grafana/Loki/Promtail,
# an optional add-on that ships these into a searchable store) lives in
# docker-compose.observability.yml.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-loomkeep}
    volumes:
      - db-data-pg18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loomkeep} -d ${POSTGRES_DB:-loomkeep}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Relative to this file's own location (docker/), not the invocation
      # cwd — the monorepo root, where apps/api/Dockerfile expects its build
      # context to start, is one level up.
      context: ..
      dockerfile: apps/api/Dockerfile
      # Empty locally (docker:dev etc — "unknown" in the image, harmless).
      # deploy.yml exports the real short SHA before `docker compose up
      # --build` on the VPS.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loomkeep}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-loomkeep}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@loomkeep.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-Loomkeep <noreply@loomkeep.app>}"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Empty = TurnstileService.verify() always passes (no Cloudflare
      # account configured) — see root README "Bot protection".
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      BACKUP_DIR: /data/backups
      GLITCHTIP_API_DSN: ${GLITCHTIP_API_DSN:-}
      HEALTHCHECKS_NOTIFICATIONS_SCAN_URL: ${HEALTHCHECKS_NOTIFICATIONS_SCAN_URL:-}
      HEALTHCHECKS_MEDIA_REFRESH_STALE_URL: ${HEALTHCHECKS_MEDIA_REFRESH_STALE_URL:-}
      HEALTHCHECKS_REPORTS_DIGEST_URL: ${HEALTHCHECKS_REPORTS_DIGEST_URL:-}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      # Shared secret for the Homepage dashboard's user-count widget
      # (GET /api/public-stats/summary) — see docker/docker-compose.homepage.yml.
      # Empty = the guard fails closed, endpoint stays unreachable.
      HOMEPAGE_STATS_API_KEY: ${HOMEPAGE_STATS_API_KEY:-}
      # Signs the SSO token for Quackback's feedback widget "Verified
      # identity only" mode — must match the secret entered in Quackback's
      # own widget settings. Empty = GET /users/me/widget-token 500s;
      # WidgetIdentify.svelte swallows that, so an unconfigured secret just
      # means the widget stays anonymous rather than breaking the app.
      QUACKBACK_WIDGET_SECRET: ${QUACKBACK_WIDGET_SECRET:-}
    volumes:
      - backup-data:/data/backups
    ports:
      - "3000:3000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
      PUBLIC_GLITCHTIP_WEB_DSN: ${PUBLIC_GLITCHTIP_WEB_DSN:-}
      # Empty = no Turnstile widget rendered, register() sends no token —
      # see root README "Bot protection".
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "8080:3000"

volumes:
  db-data-pg18:
  backup-data:
