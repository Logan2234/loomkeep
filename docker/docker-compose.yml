# Bounds each service's Docker log driver so a chatty container can't fill
# the disk. See docker-compose.observability.yml for shipping logs into Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-loomkeep}
    volumes:
      - db-data-pg18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loomkeep} -d ${POSTGRES_DB:-loomkeep}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # See docker/README.md § "Images & deploy" for how this tag is built and pinned.
    image: ghcr.io/logan2234/loomkeep-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loomkeep}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-loomkeep}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
      SIMKL_CLIENT_SECRET: ${SIMKL_CLIENT_SECRET:-}
      API_CONTACT: ${API_CONTACT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@loomkeep.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-Loomkeep <noreply@loomkeep.app>}"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Empty = TurnstileService.verify() always passes — see README "Bot protection".
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_PUBLIC_KEY: ${BACKUP_ENCRYPTION_PUBLIC_KEY:?set BACKUP_ENCRYPTION_PUBLIC_KEY in .env}
      GLITCHTIP_API_DSN: ${GLITCHTIP_API_DSN:-}
      HEALTHCHECKS_NOTIFICATIONS_SCAN_URL: ${HEALTHCHECKS_NOTIFICATIONS_SCAN_URL:-}
      HEALTHCHECKS_MEDIA_REFRESH_STALE_URL: ${HEALTHCHECKS_MEDIA_REFRESH_STALE_URL:-}
      HEALTHCHECKS_REPORTS_DIGEST_URL: ${HEALTHCHECKS_REPORTS_DIGEST_URL:-}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      HEALTHCHECKS_INACTIVE_ACCOUNTS_SCAN_URL: ${HEALTHCHECKS_INACTIVE_ACCOUNTS_SCAN_URL:-}
      # Homepage dashboard's user-count widget auth — see docker-compose.homepage.yml.
      HOMEPAGE_STATS_API_KEY: ${HOMEPAGE_STATS_API_KEY:-}
      # Quackback feedback widget SSO token signing — must match Quackback's own widget settings.
      QUACKBACK_WIDGET_SECRET: ${QUACKBACK_WIDGET_SECRET:-}
      # Quackback's "Changelog Published" webhook signing secret — see .env.example.
      QUACKBACK_CHANGELOG_WEBHOOK_SECRET: ${QUACKBACK_CHANGELOG_WEBHOOK_SECRET:-}
      # Umami Link base URL for trackable email CTAs — empty disables click tracking.
      UMAMI_LINKS_BASE_URL: ${UMAMI_LINKS_BASE_URL:-}
    volumes:
      - backup-data:/data/backups
    ports:
      - "3000:3000"

  web:
    image: ghcr.io/logan2234/loomkeep-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api}
      PUBLIC_SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
      PUBLIC_GLITCHTIP_WEB_DSN: ${PUBLIC_GLITCHTIP_WEB_DSN:-}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
      PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
      PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
    ports:
      - "8080:3000"

volumes:
  db-data-pg18:
  backup-data:
