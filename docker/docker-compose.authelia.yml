# Single sign-on portal (Authelia) for every dashboard in this stack. See
# docker/README.md § "Single sign-on" and § "Access control per public
# subdomain".
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.authelia.yml up -d --build
#
# Copy the two *.example files next to this one and fill them in.
services:
  authelia:
    image: authelia/authelia:4.39.20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: "Europe/Paris"
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-data:/config/data # SQLite storage db, persisted across restarts

  # Partial override of the `caddy` service in docker-compose.prod.yml: adds
  # Authelia's own site block + its domain.
  caddy:
    environment:
      AUTHELIA_SITE_ADDRESS: auth.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./authelia/authelia.caddy:/etc/caddy/sites-enabled/authelia.caddy:ro
    depends_on:
      - authelia

volumes:
  authelia-data:
