# Provisioned automatically at Grafana startup — no manual "add data source"
# click-through needed. See https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    # Explicit (not auto-generated) so it can be hardcoded in Homepage's
    # "recent error logs" Explore deep link (docker/homepage/bookmarks.yaml)
    # — an auto-generated UID would break that link on every re-provision.
    uid: loki

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
