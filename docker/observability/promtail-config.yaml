# Auto-discovers every running container via the Docker socket (no need to
# list loomkeep's services by hand — any container on the host gets picked
# up, including ones added later) and tails its json-file logs from
# /var/lib/docker/containers, which docker-compose.yml's `x-logging` already
# rotates. `container`/`stream` labels let Grafana filter by service.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
