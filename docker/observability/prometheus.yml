# Scrape config for the API + node_exporter + postgres_exporter + Caddy's own
# /metrics — the host, DB, reverse proxy and the API process.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]

  # The API's own technical metrics (Node runtime + HTTP latency) — reached
  # over the internal Docker network, never through Caddy. Bearer token read
  # at scrape time from a gitignored file so METRICS_API_KEY stays out of
  # this committed file; the endpoint fails closed without it.
  - job_name: api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:3000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token

  # Healthchecks.io's per-project metrics endpoint — see root README "Job
  # monitoring". Bearer token read at scrape time from a gitignored file so
  # the API key stays out of this committed file.
  - job_name: healthchecks
    scrape_interval: 60s
    scheme: https
    metrics_path: /projects/7ccfcfc5-06a3-4a11-8991-f6e1c3595217/metrics/
    static_configs:
      - targets: ["healthchecks.io"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/healthchecks_token
