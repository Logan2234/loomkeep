# User feedback board (Quackback — an open-source, self-hostable alternative
# to Canny/UserVoice with feedback boards, voting, a roadmap and a
# changelog). Add on top of the base compose + whichever deployment override
# you're using:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.quackback.yml up -d --build
#
# Own dedicated Postgres + Valkey, same reasoning as GlitchTip's: an add-on
# shouldn't share a failure domain with the app it's separate from. Valkey
# (not Quackback's own docs' suggested Dragonfly) to stay consistent with the
# Redis-compatible store already used for GlitchTip in this stack, rather
# than adding a second caching technology for the same job.
#
# S3/MinIO (image uploads in the rich-text editor) is deliberately left
# unconfigured — optional per Quackback's own docs (falls back to disabling
# image upload), not worth a fourth dedicated service for a single-user
# instance. Add S3_* env vars later if that's ever actually needed.
#
# Reachable at QUACKBACK_SITE_ADDRESS (e.g. feedback.loomkeep.app) via Caddy
# — see feedback/quackback.caddy, imported by the base Caddyfile only when
# this override is in use. Gated by Quackback's own login only (email OTP —
# see EMAIL_SMTP_* below), no basic auth in front, same call as
# Grafana/Portainer/GlitchTip.
x-quackback-logging: &quackback-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  quackback-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    logging: *quackback-logging
    environment:
      POSTGRES_USER: quackback
      POSTGRES_PASSWORD: ${QUACKBACK_DB_PASSWORD:?set QUACKBACK_DB_PASSWORD in .env}
      POSTGRES_DB: quackback
    volumes:
      # Parent-dir mount, same reasoning as the app's own `db` service in
      # docker-compose.yml: postgres 18+'s image refuses a volume mounted
      # directly at .../data.
      - quackback-pg-data:/var/lib/postgresql

  quackback-valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    logging: *quackback-logging

  quackback:
    image: ghcr.io/quackbackio/quackback:latest
    restart: unless-stopped
    logging: *quackback-logging
    environment:
      DATABASE_URL: postgres://quackback:${QUACKBACK_DB_PASSWORD:?set QUACKBACK_DB_PASSWORD in .env}@quackback-postgres:5432/quackback
      REDIS_URL: redis://quackback-valkey:6379
      SECRET_KEY: ${QUACKBACK_SECRET_KEY:?set QUACKBACK_SECRET_KEY in .env}
      BASE_URL: https://feedback.${DOMAIN:?set DOMAIN in .env}
      # Login is email-OTP based — without SMTP the code is only visible via
      # `docker compose logs quackback`, fine to start but not for real use.
      # Reuses the app's own Brevo SMTP creds (discrete host/user/pass
      # fields here, unlike GlitchTip's single EMAIL_URL, so the "@" in
      # SMTP_USER doesn't need escaping).
      EMAIL_SMTP_HOST: ${SMTP_HOST}
      EMAIL_SMTP_PORT: ${SMTP_PORT}
      EMAIL_SMTP_USER: ${SMTP_USER}
      EMAIL_SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${QUACKBACK_FROM_EMAIL:-feedback@loomkeep.app}
      DISABLE_TELEMETRY: "true"
    depends_on:
      - quackback-postgres
      - quackback-valkey

  # Partial override of the `caddy` service defined in docker-compose.prod.yml:
  # adds the Quackback site block + its domain, without redeclaring the
  # whole service.
  caddy:
    environment:
      QUACKBACK_SITE_ADDRESS: feedback.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./feedback/quackback.caddy:/etc/caddy/sites-enabled/quackback.caddy:ro
    depends_on:
      - quackback

volumes:
  quackback-pg-data:
