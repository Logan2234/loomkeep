# Override for hosting Loomkeep publicly on a VPS with a real domain behind
# Caddy, which obtains and renews a Let's Encrypt certificate automatically.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Point the domain's A/AAAA record at the VPS and open ports 80+443 first
# (see README "Public hosting (VPS)").
services:
  web:
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: https://${DOMAIN:?set DOMAIN in .env}/api

  api:
    environment:
      NODE_ENV: production
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Safe because Caddy is always the one hop in front of the API here.
      TRUST_PROXY: "true"
      # Public instance — turn social features on.
      SOCIAL_ENABLED: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - api
      - web
    environment:
      SITE_ADDRESS: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www-redirect.caddy:/etc/caddy/sites-enabled/www-redirect.caddy:ro
      - ./maintenance:/srv/maintenance:ro
      # Bind mount, not a named volume, so the maintenance flag is a plain
      # host path an admin can toggle over SSH — see Caddyfile.
      - ./caddy-flags:/flags
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy-data:
  caddy-config:
