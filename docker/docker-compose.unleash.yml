# Unleash (self-hosted, open-source feature flag service). Backs the
# deployment-wide flags read by the api at runtime (SOCIAL_ENABLED,
# REGISTRATION_ENABLED, MAINTENANCE_<DOMAIN>) so an admin can flip them
# without a redeploy. See docker/README.md § "Access control per public
# subdomain" and § "Shared Postgres for add-ons".
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.unleash.yml up -d
#
# The api talks to Unleash's client API over the internal Docker network
# (UNLEASH_API_URL). The web additionally talks to Unleash's Frontend API
# straight from the browser, over the public subdomain, to refresh
# MAINTENANCE_<DOMAIN> flags live without a page reload — see
# apps/web/src/lib/feature-flags-live.ts. CORS for the web origin must be
# allowed in Unleash's own admin UI (Admin settings > Access control > CORS
# origins).
x-unleash-logging: &unleash-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  unleash:
    image: unleashorg/unleash-server:8.1.0
    restart: unless-stopped
    logging: *unleash-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loomkeep}:${POSTGRES_PASSWORD}@db:5432/unleash?sslmode=disable
      # Backend token the api authenticates to Unleash's client API with.
      # Format: `<project>:<environment>.<64-hex-chars>` — see .env.example.
      INIT_BACKEND_API_TOKENS: ${UNLEASH_API_TOKEN:?set UNLEASH_API_TOKEN in .env}
      # Frontend token, safe to expose in the browser (read-only).
      INIT_FRONTEND_API_TOKENS: ${PUBLIC_UNLEASH_FRONTEND_TOKEN:?set PUBLIC_UNLEASH_FRONTEND_TOKEN in .env}
      UNLEASH_DEFAULT_ADMIN_USERNAME: ${UNLEASH_ADMIN_USERNAME:-admin}
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_ADMIN_PASSWORD:?set UNLEASH_ADMIN_PASSWORD in .env}
      CHECK_VERSION: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Partial override of the `db` service in docker-compose.yml: adds the
  # init script that creates the `unleash` database on a brand-new volume.
  db:
    volumes:
      - ./flags/init-unleash-db.sql:/docker-entrypoint-initdb.d/init-unleash-db.sql:ro

  # Partial override of the `api` service in docker-compose.yml: adds the
  # env vars the api needs to reach Unleash over the internal Docker network.
  api:
    environment:
      UNLEASH_API_URL: http://unleash:4242/api
      UNLEASH_API_TOKEN: ${UNLEASH_API_TOKEN:?set UNLEASH_API_TOKEN in .env}
    depends_on:
      - unleash

  # Partial override of the `web` service in docker-compose.yml: adds the
  # PUBLIC_ vars the browser needs to reach Unleash's Frontend API directly.
  web:
    environment:
      PUBLIC_UNLEASH_FRONTEND_URL: https://flags.${DOMAIN:?set DOMAIN in .env}/api/frontend
      PUBLIC_UNLEASH_FRONTEND_TOKEN: ${PUBLIC_UNLEASH_FRONTEND_TOKEN:?set PUBLIC_UNLEASH_FRONTEND_TOKEN in .env}

  # Partial override of the `caddy` service in docker-compose.prod.yml: adds
  # the Unleash site block + its domain.
  caddy:
    environment:
      UNLEASH_SITE_ADDRESS: flags.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./flags/unleash.caddy:/etc/caddy/sites-enabled/unleash.caddy:ro
    depends_on:
      - unleash
