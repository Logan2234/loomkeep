---
- logo:
    icon: /images/favicon.svg

- search:
    provider: google
    focus: false
    target: _blank
    showSearchSuggestions: true

- resources:
    # cpu/memory are the Homepage CONTAINER's own usage, not the VPS host's
    # — a systeminformation limitation (gethomepage.dev/widgets/information/
    # resources), no volume mount fixes that part. The real host numbers
    # are the "VPS" tile in services.yaml (Prometheus/node_exporter). disk
    # is different: with /:/host:ro mounted (docker-compose.homepage.yml),
    # /host below IS the real host root filesystem.
    cpu: true
    units: metric
    memory: true
    disk: /host
    expanded: true
    diskUnits: bytes
    refresh: 3000
    uptime: false
    network: false
    cputemp: false
    tempmin: 0
    tempmax: 100

- openmeteo:
    label: Lyon, France
    latitude: 45.74442735225648
    longitude: 4.858944814376149
    timezone: Europe/Paris
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1
