---
# Five groups, each with Homepage's native header (icon + title) — plain
# default styling. Order within and across groups is deliberate: Loomkeep
# itself, then infra (external uptime before anything self-hosted), then
# GitHub/quality, then email, then the alert-list tiles last.
- Loomkeep:
    - App:
        href: https://loomkeep.app
        description: Series, movies, anime, games, books, music
        icon: https://loomkeep.app/apple-touch-icon.png
        # No widget: a "Statut" field added no real information (the tile
        # already links out, and Docker's own healthcheck is what actually
        # gates traffic) — dropped rather than kept for the sake of having
        # one.
    - Statistiques:
        # Click goes to the real admin stats page — these are just the
        # cheap numbers worth seeing at a glance (see
        # apps/api/src/admin/public-stats.controller.ts — deliberately not
        # the full /admin/stats getStats(), which computes cohorts/
        # retention curves too heavy for a ~10s widget poll).
        href: https://loomkeep.app/admin/stats
        description: Vue d'ensemble de l'activité
        icon: mdi-chart-line
        widget:
          type: customapi
          url: http://api:3000/api/public-stats/summary
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_STATS_API_KEY}}"
          mappings:
            - field: userCount
              label: Utilisateurs
            - field: mediaCount
              label: Médias suivis
            - field: openReports
              label: Signalements
            - field: newUsers7d
              label: Nouveaux (7j)
    - Admin:
        href: https://loomkeep.app/admin
        description: Panel admin (utilisateurs, backups, signalements...)
        icon: mdi-shield-account
        # Ordered App, Statistiques, Admin (not alphabetical/original order)
        # specifically so a 2-column row places Admin directly under App —
        # Homepage's grid has no per-tile row-span, so this is done by
        # ordering into the grid's natural row-major fill instead: row 1 is
        # App|Statistiques, row 2 is Admin|(empty).

- Infrastructure:
    - Healthchecks:
        href: https://healthchecks.io/checks/
        description: Scheduled jobs dead-man's-switch (backups, scans...)
        icon: mdi-heart-pulse
        # No uuid set: native widget shows aggregate up/down across every
        # check in the account instead of a single job — see the "Job
        # monitoring" section in the root README for what pings into this.
        widget:
          type: healthchecks
          url: https://healthchecks.io
          key: "{{HOMEPAGE_VAR_HEALTHCHECKS_API_KEY}}"
          fields: ["up", "down"]
          # Block highlighting (docs: configs/services.md#block-highlighting)
          # — native widgets support it, customapi doesn't, hence this only
          # appears on Healthchecks/UptimeRobot/Portainer/VPS below. Bare
          # keys ("up"/"down") auto-namespace to "healthchecks.up"/".down"
          # internally, matching the untranslated label the widget renders.
          highlight:
            up:
              valueOnly: true
              numeric:
                - level: good
                  when: gt
                  value: 0
            down:
              valueOnly: true
              numeric:
                - level: danger
                  when: gt
                  value: 0
    - UptimeRobot:
        href: https://dashboard.uptimerobot.com/monitors
        description: Disponibilité (contrôle externe, hors du VPS)
        icon: si-uptimerobot
        # Read-Only API key (UptimeRobot > My Settings) — can't modify
        # anything, only summarize every monitor in the account.
        widget:
          type: uptimerobot
          url: https://api.uptimerobot.com
          key: "{{HOMEPAGE_VAR_UPTIMEROBOT_API_KEY}}"
          fields: ["sitesUp", "sitesDown"]
          highlight:
            sitesUp:
              valueOnly: true
              numeric:
                - level: good
                  when: gt
                  value: 0
            sitesDown:
              valueOnly: true
              numeric:
                - level: danger
                  when: gt
                  value: 0
    - Portainer:
        href: https://portainer.loomkeep.app
        description: Docker management
        icon: si-portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: "{{HOMEPAGE_VAR_PORTAINER_ENV_ID}}"
          key: "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}"
          fields: ["running", "stopped", "total"]
          highlight:
            running:
              valueOnly: true
              numeric:
                - level: good
                  when: gt
                  value: 0
            stopped:
              valueOnly: true
              numeric:
                - level: danger
                  when: gt
                  value: 0
    - VPS:
        href: https://grafana.loomkeep.app
        description: CPU / RAM / disque de l'hôte
        icon: mdi-server
        # Same node_exporter metrics as the "Node Exporter Full" Grafana
        # dashboard, just the top-line numbers surfaced here too. Links to
        # Grafana (no dedicated page for this) since that's where the actual
        # history/graphs live.
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          # Highlighting isn't documented either way for prometheusmetric
          # (only customapi is explicitly called out as unsupported) — keys
          # match each metric's `label` below verbatim. First thing to check
          # live if these don't render: this may turn out unsupported too.
          # Thresholds match what was asked: green under 33%, amber 33-66%,
          # red above.
          highlight:
            CPU:
              valueOnly: true
              numeric:
                - level: danger
                  when: gte
                  value: 66
                - level: warn
                  when: gte
                  value: 33
                - level: good
                  when: lt
                  value: 33
            RAM:
              valueOnly: true
              numeric:
                - level: danger
                  when: gte
                  value: 66
                - level: warn
                  when: gte
                  value: 33
                - level: good
                  when: lt
                  value: 33
            Disque:
              valueOnly: true
              numeric:
                - level: danger
                  when: gte
                  value: 66
                - level: warn
                  when: gte
                  value: 33
                - level: good
                  when: lt
                  value: 33
          metrics:
            - label: CPU
              query: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              format:
                type: number
                options:
                  maximumFractionDigits: 1
              suffix: "%"
            - label: RAM
              query: 100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)
              format:
                type: number
                options:
                  maximumFractionDigits: 1
              suffix: "%"
            - label: Disque
              query: 100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100)
              format:
                type: number
                options:
                  maximumFractionDigits: 1
              suffix: "%"
    - Base de données:
        href: https://grafana.loomkeep.app
        description: Taille et volumétrie Postgres
        icon: mdi-database
        # Deliberately NOT in the app's own /admin/stats (moved out on
        # purpose — this is infra monitoring, not Loomkeep business data,
        # and doesn't need a query running on every admin page load). Same
        # pg_stat_user_tables/pg_database collectors postgres_exporter
        # already exposes by default, no custom queries.yaml needed.
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          metrics:
            - label: Taille
              query: pg_database_size_bytes{datname="loomkeep"}
              format:
                type: bytes
            - label: Lignes (total)
              query: sum(pg_stat_user_tables_n_live_tup)
              format:
                type: number
    - Grafana:
        # Back to one tile (was briefly split into "Grafana · Dashboards" /
        # "· Datasources" so each had its own click target — reverted since
        # a single card reads better and the split precision wasn't worth
        # the extra tile).
        href: https://grafana.loomkeep.app
        description: Dashboards & sources de données
        icon: si-grafana
        widget:
          type: grafana
          version: 2
          url: http://grafana:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
          # totalalerts/alertstriggered hit /api/admin/stats, which needs
          # the "server.stats:read" RBAC permission — not granted to the
          # admin account by default on this Grafana version (confirmed
          # live: "Access denied" even via the real GF_SECURITY_ADMIN_*
          # superadmin). dashboards/datasources use plain org-scoped
          # endpoints instead, no such gate.
          fields: ["dashboards", "datasources"]

- GitHub & qualité:
    - Déploiement:
        # Three stacked widgets (Homepage's `widgets:` plural — each an
        # independent API call rendered as one more row). A true row layout
        # (values side by side, like a single widget's mapped fields) needs
        # every value on ONE api response — these three come from three
        # different endpoints (own API, commits, workflow runs), and
        # Homepage only lays fields side-by-side within one `mappings` list
        # on one call. Stacking separate widgets is always vertical, no
        # config for it — confirmed against Homepage's own item.jsx source.
        # The only way around it is a small proxy combining all three
        # server-side into one JSON response, which is more machinery than
        # this is worth.
        href: https://github.com/Logan2234/loomkeep/actions
        description: Build actuellement déployé
        icon: mdi-rocket-launch
        widgets:
          - type: customapi
            url: http://api:3000/api/public-stats/summary
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_STATS_API_KEY}}"
            mappings:
              - field: gitSha
                label: SHA déployé
          - type: customapi
            url: https://api.github.com/repos/Logan2234/loomkeep/commits/main
            refreshInterval: 300000
            headers:
              User-Agent: "loomkeep-homepage"
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
            mappings:
              - field: commit.author.date
                label: Main
                format: relativeDate
          - type: customapi
            url: https://api.github.com/repos/Logan2234/loomkeep/actions/workflows/deploy.yml/runs?status=success&per_page=1
            refreshInterval: 300000
            headers:
              User-Agent: "loomkeep-homepage"
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
            mappings:
              - field: workflow_runs.0.updated_at
                label: Déploiement
                format: relativeDate
    - Pull requests & issues:
        # Same "can't lay separate widgets side by side" limitation as
        # Déploiement above.
        href: https://github.com/Logan2234/loomkeep/pulls
        description: Ouvertes sur GitHub
        icon: mdi-source-pull
        widgets:
          - type: customapi
            # GitHub's search API, not the plain PRs list endpoint — a bare
            # count without paginating every open PR. `is:pr` since PRs are
            # technically issues under the hood, `is:open` to exclude
            # merged/closed.
            url: "https://api.github.com/search/issues?q=repo:Logan2234/loomkeep+is:pr+is:open"
            refreshInterval: 300000
            headers:
              User-Agent: "loomkeep-homepage"
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
            mappings:
              - field: total_count
                label: PR ouvertes
          - type: customapi
            url: "https://api.github.com/search/issues?q=repo:Logan2234/loomkeep+is:issue+is:open"
            refreshInterval: 300000
            headers:
              User-Agent: "loomkeep-homepage"
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
            mappings:
              - field: total_count
                label: Issues ouvertes
    - Qualité:
        href: https://app.codecov.io/gh/Logan2234/loomkeep
        description: Couverture de tests & score de sécurité
        icon: si-codecov
        # Two stacked widgets: Codecov's totals, and the OpenSSF Scorecard
        # JSON API (same source as the README badge, api.securityscorecards.dev
        # — public, no auth). Highlighting doesn't apply to either: both are
        # customapi.
        widgets:
          - type: customapi
            # Codecov's own API docs declare Bearer auth as required for
            # this endpoint's schema, but public-repo badges work
            # token-free — real behavior for a public repo's read-only
            # totals is unconfirmed either way. Left the token optional
            # (empty header if unset); if this shows an auth error,
            # generate one in Codecov > Settings > Access and set
            # CODECOV_API_TOKEN in .env.
            url: https://api.codecov.io/api/v2/github/Logan2234/repos/loomkeep/totals/
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_CODECOV_API_TOKEN}}"
            mappings:
              - field: totals.coverage
                label: Couverture
                suffix: "%"
          - type: customapi
            url: https://api.securityscorecards.dev/projects/github.com/Logan2234/loomkeep
            refreshInterval: 3600000
            mappings:
              - field: score
                label: Scorecard
                suffix: " / 10"

# Split out of "GitHub & qualité" — Brevo has nothing to do with the repo,
# it's about the app's own outgoing mail.
- Emails:
    - Brevo:
        href: https://app.brevo.com
        description: Envois transactionnels du jour (quota 300/jour)
        icon: si-brevo
        # aggregatedReport?days=1 = aujourd'hui only. No single "failed"
        # field in Brevo's response — hardBounces is the clearest signal
        # (permanent delivery failures); soft bounces/blocked exist too but
        # showing every failure category would be more noise than signal on
        # a small tile. Brevo's response also carries its own "error" field
        # (a real metric — undocumented exact meaning, presumably delivery
        # errors distinct from bounces), which MUST be in `mappings` or
        # Homepage's customapi treats the whole response as failed just
        # because that key exists (confirmed against its component source —
        # same root cause as the App tile's health-check "error" field).
        # No highlighting: customapi doesn't support it, no workaround.
        widget:
          type: customapi
          url: https://api.brevo.com/v3/smtp/statistics/aggregatedReport?days=1
          headers:
            api-key: "{{HOMEPAGE_VAR_BREVO_API_KEY}}"
          mappings:
            - field: requests
              label: Envoyés
            - field: delivered
              label: Livrés
            - field: hardBounces
              label: Échecs
            - field: error
              label: Erreurs

- Alertes:
    - GlitchTip:
        href: https://errors.loomkeep.app
        description: Error tracking
        icon: si-sentry
        # No native GlitchTip widget in Homepage (checked, doesn't exist) —
        # this is a hand-built call against GlitchTip's own Sentry-compatible
        # issues API, listing the most recent unresolved issues instead of a
        # clean count (the API returns a paginated array, no bare count
        # field to map). More fragile than the other widgets — first thing
        # to check if it ever shows nothing after a GlitchTip upgrade.
        widgets:
          - type: customapi
            url: "http://glitchtip:8000/api/0/organizations/{{HOMEPAGE_VAR_GLITCHTIP_ORG_SLUG}}/issues/?query=is:unresolved&limit=5"
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_GLITCHTIP_API_TOKEN}}"
            display: dynamic-list
            mappings:
              # Array is at the root of the response, so no "items" key
              # (mappings is a single map here, not a list — my first
              # attempt got this wrong, confirmed against Homepage's docs).
              name: title
              label: culprit
              target: "https://errors.loomkeep.app/{{HOMEPAGE_VAR_GLITCHTIP_ORG_SLUG}}/issues/{id}"
          - type: customapi
            # Second call to the SAME endpoint (limit bumped to 100) just to
            # get a "Total" count via format: size (array length, per
            # Homepage's customapi docs) — the list above stays capped at 5
            # rows for readability. Duplicate request is the only way:
            # Homepage doesn't let one dynamic-list widget also expose a
            # plain count field. Caveat: this total is itself capped at 100;
            # if it ever reads exactly "100" there may be more.
            url: "http://glitchtip:8000/api/0/organizations/{{HOMEPAGE_VAR_GLITCHTIP_ORG_SLUG}}/issues/?query=is:unresolved&limit=100"
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_GLITCHTIP_API_TOKEN}}"
            mappings:
              - label: Total
                format: size
    - Dependabot:
        href: https://github.com/Logan2234/loomkeep/security/dependabot
        description: Vulnérabilités de dépendances ouvertes
        icon: mdi-shield-alert
        # Needs a real token even for a public repo (GitHub's own docs:
        # Dependabot alerts aren't unauthenticated-readable) — a
        # fine-grained PAT scoped to just this repo, "Dependabot alerts:
        # read-only" permission, nothing else.
        widgets:
          - type: customapi
            url: https://api.github.com/repos/Logan2234/loomkeep/dependabot/alerts?state=open&per_page=100
            refreshInterval: 300000
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
              User-Agent: "loomkeep-homepage"
            display: dynamic-list
            mappings:
              name: security_advisory.summary
              label: security_advisory.severity
              target: html_url
              limit: 5
          - type: customapi
            # Same caveat as GlitchTip's Total above: capped at per_page=100
            # (GitHub's own max), not a true unbounded total.
            url: https://api.github.com/repos/Logan2234/loomkeep/dependabot/alerts?state=open&per_page=100
            refreshInterval: 300000
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
              User-Agent: "loomkeep-homepage"
            mappings:
              - label: Total
                format: size
    - Code scanning:
        href: https://github.com/Logan2234/loomkeep/security/code-scanning
        description: Alertes CodeQL ouvertes
        icon: si-github
        # Same fine-grained PAT as Dependabot above, but needs its own
        # separate "Code scanning alerts: read-only" repo permission added
        # to it — GitHub gates the two APIs independently even though both
        # sit under the same repo's Security tab. If this tile stays empty
        # while https://github.com/Logan2234/loomkeep/security/code-scanning
        # shows real alerts, that permission is the first thing to check.
        #
        # No severity sort: GitHub's code-scanning alerts API only sorts by
        # `created`/`updated` (confirmed against GitHub's own REST docs),
        # and Homepage's dynamic-list widget has no client-side sort option
        # either — listed in whatever order GitHub returns them (newest
        # first, GitHub's default).
        widgets:
          - type: customapi
            url: https://api.github.com/repos/Logan2234/loomkeep/code-scanning/alerts?state=open&per_page=100
            refreshInterval: 300000
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
              User-Agent: "loomkeep-homepage"
            display: dynamic-list
            mappings:
              name: rule.description
              label: rule.security_severity_level
              target: html_url
              limit: 5
          - type: customapi
            url: https://api.github.com/repos/Logan2234/loomkeep/code-scanning/alerts?state=open&per_page=100
            refreshInterval: 300000
            headers:
              Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
              User-Agent: "loomkeep-homepage"
            mappings:
              - label: Total
                format: size
