# Portainer: web UI for managing this VPS's Docker containers/images/volumes
# without SSH. See docker/README.md § "Access control per public subdomain".
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.portainer.yml up -d --build
services:
  portainer:
    image: portainer/portainer-ce:2.39.6
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # --http-enabled: Portainer's HTTPS on :9443 uses a self-signed cert,
    # which would produce confusing TLS errors behind Caddy. Serve plain
    # HTTP on :9000 instead for Caddy to sit in front of.
    command: -H unix:///var/run/docker.sock --http-enabled
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  # Partial override of the `caddy` service in docker-compose.prod.yml: adds
  # the Portainer site block + its domain.
  caddy:
    environment:
      PORTAINER_SITE_ADDRESS: portainer.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./observability/portainer.caddy:/etc/caddy/sites-enabled/portainer.caddy:ro
    depends_on:
      - portainer

volumes:
  portainer-data:
