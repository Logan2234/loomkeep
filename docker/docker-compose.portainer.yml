# Optional add-on: Portainer, a web UI for managing this VPS's Docker
# containers/images/volumes without SSH. Add on top of the base compose +
# whichever deployment override you're using:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.portainer.yml up -d --build
#
# Reachable at PORTAINER_SITE_ADDRESS (e.g. portainer.loomkeep.app) via Caddy
# — see observability/portainer.caddy, imported by the base Caddyfile only
# when this override is in use. Gated by Portainer's own admin login only
# (set on first visit), no basic auth in front — same call as Grafana.
#
# `x-logging` is redeclared here rather than reused from docker-compose.yml,
# same reasoning as every other override (Compose doesn't merge YAML anchors
# across separate -f files).
services:
  portainer:
    # 2.40.0, not 2.39.6: fixes a Go mime.ParseMediaType panic
    # ("mime: invalid media parameter") on OAuth resource retrieval, hit
    # against Cloudflare Access specifically — its userinfo endpoint returns
    # a malformed, duplicated Content-Type
    # (`application/json; charset=utf-8, application/json`) that Portainer's
    # OAuth client couldn't parse pre-2.40.0 (portainer/portainer#12409). Not
    # confirmed fixed by the 2.40.0 changelog itself (issue was only labeled
    # for that release) — if OAuth login still fails after this bump, the
    # fallback is a Caddy-side proxy in front of Cloudflare's userinfo
    # endpoint that rewrites Content-Type before Portainer ever sees it.
    image: portainer/portainer-ce:2.40.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # --http-enabled: Portainer's HTTPS on :9443 uses a self-signed cert, and
    # Caddy already terminates real TLS for the public domain — proxying to
    # that self-signed backend just produces confusing TLS errors. Serve
    # plain HTTP on :9000 instead for Caddy to sit in front of.
    command: -H unix:///var/run/docker.sock --http-enabled
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  # Partial override of the `caddy` service defined in docker-compose.prod.yml:
  # adds the Portainer site block + its domain, without redeclaring the
  # whole service.
  caddy:
    environment:
      PORTAINER_SITE_ADDRESS: portainer.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./observability/portainer.caddy:/etc/caddy/sites-enabled/portainer.caddy:ro
    depends_on:
      - portainer

volumes:
  portainer-data:
