# GlitchTip (self-hosted, Sentry-API-compatible error tracker). See
# docker/README.md § "Error tracking" and § "Shared Postgres for add-ons".
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.glitchtip.yml up -d --build
#
# Runs in `SERVER_ROLE: all_in_one` mode (web + Celery worker + beat in one
# container) — low-traffic single/few-user instance, not worth splitting.
# Keeps its own dedicated Valkey (unrelated to Postgres sharing).
#
# Config values reference: https://glitchtip.com/documentation/install
x-glitchtip-logging: &glitchtip-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-glitchtip-environment: &glitchtip-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-loomkeep}:${POSTGRES_PASSWORD}@db:5432/glitchtip
  VALKEY_URL: redis://glitchtip-valkey:6379
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env}
  GLITCHTIP_DOMAIN: https://errors.${DOMAIN:?set DOMAIN in .env}
  # `glitchtip` (the bare service name) is included alongside the public
  # hostname since Caddy's own healthcheck/internal requests hit it by name.
  ALLOWED_HOSTS: errors.${DOMAIN:?set DOMAIN in .env},glitchtip
  # Required behind a reverse proxy fronting a different domain than the
  # container sees directly — without it, the OIDC/SSO callback can be
  # silently rejected as cross-origin.
  CSRF_TRUSTED_ORIGINS: https://errors.${DOMAIN:?set DOMAIN in .env}
  # Off by default — GlitchTip's EMAIL_URL is parsed as a plain URL, and the
  # app's Brevo SMTP_USER contains a literal "@" that breaks that unescaped.
  # Set GLITCHTIP_EMAIL_URL yourself (percent-encoded) for real delivery.
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@loomkeep.app}
  # Django admin at /admin/ exposes raw DB-level access — off by default,
  # env-var driven so it can be flipped for the one-time OIDC/SSO setup
  # without a git commit (auto-deploy would otherwise revert it).
  ENABLE_ADMIN: false

services:
  glitchtip-valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    logging: *glitchtip-logging

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    logging: *glitchtip-logging
    environment:
      <<: *glitchtip-environment
      SERVER_ROLE: all_in_one
      ENABLE_ORGANIZATION_CREATION: false
      ENABLE_USER_REGISTRATION: false

    volumes:
      - glitchtip-uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started

  # Partial override of the `db` service in docker-compose.yml: adds the
  # init script that creates the `glitchtip` database on a brand-new volume.
  db:
    volumes:
      - ./observability/init-glitchtip-db.sql:/docker-entrypoint-initdb.d/init-glitchtip-db.sql:ro

  # Partial override of the `caddy` service in docker-compose.prod.yml: adds
  # the GlitchTip site block + its domain.
  caddy:
    environment:
      GLITCHTIP_SITE_ADDRESS: errors.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./observability/glitchtip.caddy:/etc/caddy/sites-enabled/glitchtip.caddy:ro
    depends_on:
      - glitchtip

volumes:
  glitchtip-uploads:
