# Umami: lightweight, self-hosted, cookie-less analytics for the public
# landing page — see root README "Analytics" and docker/README.md § "Access
# control per public subdomain" / § "Shared Postgres for add-ons". NOT
# covered by the app's own pg_dump-based backup job — accepted since
# analytics data is low-stakes and re-collectable.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.umami.yml up -d --build
#
# Default admin/umami login on first visit — change it immediately.
services:
  umami:
    image: ghcr.io/umami-software/umami:3.3.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loomkeep}:${POSTGRES_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "0"
      # Renamed off the defaults (script.js, /api/send): generic ad-blocker
      # filter lists block those exact names even for cookie-less tools.
      TRACKER_SCRIPT_NAME: loomkeep.js
      COLLECT_API_ENDPOINT: /api/loom
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Partial override of the `db` service in docker-compose.yml: adds the
  # init script that creates the `umami` database on a brand-new volume.
  db:
    volumes:
      - ./umami/init-umami-db.sql:/docker-entrypoint-initdb.d/init-umami-db.sql:ro

  # Partial override of the `caddy` service in docker-compose.prod.yml: adds
  # the Umami site block + its domain.
  caddy:
    environment:
      UMAMI_SITE_ADDRESS: stats.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./umami/umami.caddy:/etc/caddy/sites-enabled/umami.caddy:ro
    depends_on:
      - umami
