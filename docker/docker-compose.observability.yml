# Grafana + Loki/Promtail (logs) + Prometheus/node_exporter/postgres_exporter/
# cAdvisor (metrics). See docker/README.md § "Access control per public
# subdomain" and § "Shared Postgres for add-ons".
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.observability.yml up -d --build
#
# Grafana is also reachable at 127.0.0.1:3001 without Caddy/DNS, via an SSH
# tunnel: `ssh -L 3001:localhost:3001 <user>@<vps>`.
#
# `x-logging` is redeclared (not reused from docker-compose.yml) since
# Compose doesn't merge YAML anchors across separate `-f` files.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Single sign-on via Authelia — GRAFANA_OIDC_CLIENT_SECRET is the
      # plaintext secret (Authelia's own config stores only its hash).
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-localhost}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authelia
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${DOMAIN:-localhost}/api/oidc/authorization
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${DOMAIN:-localhost}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${DOMAIN:-localhost}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - loki
      - prometheus

  # Host-level metrics. No public port — scraped by Prometheus over the
  # compose network.
  node_exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *default-logging
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  # Reuses the app's own DB user — single-user self-host, not worth a
  # dedicated read-only monitoring role.
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-loomkeep}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-loomkeep}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Per-container metrics. No privileged flag needed on modern kernels.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Healthchecks.io read-only API key — gitignored, copied from
      # healthchecks_token.example.
      - ./observability/healthchecks_token:/etc/prometheus/secrets/healthchecks_token:ro
      - prometheus-data:/prometheus
    depends_on:
      - node_exporter
      - postgres_exporter
      - cadvisor

  # Partial override of the `caddy` service in docker-compose.prod.yml: adds
  # the Grafana site block + its domain.
  caddy:
    environment:
      GRAFANA_SITE_ADDRESS: grafana.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./observability/grafana.caddy:/etc/caddy/sites-enabled/grafana.caddy:ro
    depends_on:
      - grafana

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
