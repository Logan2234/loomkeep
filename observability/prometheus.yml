# Scrape config for Palier 2's metrics stack (node_exporter + postgres_exporter).
# App-level metrics (a NestJS /metrics endpoint) aren't wired up yet — this
# only covers host + database, not the API process itself.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
