<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loomkeep</title>
    <link rel="stylesheet" href="shell.css" />
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        text-align: left;
      }
      label {
        font-size: 0.875rem;
        font-weight: 600;
      }
      input {
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        background: transparent;
        color: var(--fg);
        font: inherit;
        transition: border-color 150ms ease;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      #error {
        color: var(--danger);
        font-size: 0.875rem;
        margin: 0;
      }
      #error:empty {
        display: none;
      }
      #current {
        font-size: 0.875rem;
        margin: 1.25rem 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="body"></p>
      <form id="form">
        <label id="label" for="address"></label>
        <input
          id="address"
          type="text"
          inputmode="url"
          autocapitalize="none"
          autocomplete="url"
          spellcheck="false"
          placeholder="media.example.com"
          required />
        <p id="error" role="alert"></p>
        <button id="connect" type="submit"></button>
        <button id="reset" class="secondary" type="button" hidden></button>
      </form>
      <p id="current"></p>
      <a id="cancel" href="#"></a>
    </main>
    <script>
      const copy = {
        en: {
          title: "Choose your instance",
          body: "Enter the address of the Loomkeep server you use.",
          label: "Instance address",
          connect: "Connect",
          checking: "Checking…",
          reset: "Use loomkeep.app",
          current: "Current instance: {host}",
          cancel: "Cancel",
          invalid: "Enter an https address, such as media.example.com.",
          unreachable:
            "This address doesn't answer. Check it, and your connection.",
          "not-loomkeep": "This address isn't a Loomkeep instance.",
        },
        fr: {
          title: "Choisir ton instance",
          body: "Saisis l'adresse du serveur Loomkeep que tu utilises.",
          label: "Adresse de l'instance",
          connect: "Se connecter",
          checking: "Vérification…",
          reset: "Utiliser loomkeep.app",
          current: "Instance actuelle : {host}",
          cancel: "Annuler",
          invalid: "Saisis une adresse en https, par exemple media.example.com.",
          unreachable:
            "Cette adresse ne répond pas. Vérifie-la, ainsi que ta connexion.",
          "not-loomkeep": "Cette adresse n'est pas une instance Loomkeep.",
        },
        it: {
          title: "Scegli la tua istanza",
          body: "Inserisci l'indirizzo del server Loomkeep che usi.",
          label: "Indirizzo dell'istanza",
          connect: "Connetti",
          checking: "Verifica…",
          reset: "Usa loomkeep.app",
          current: "Istanza attuale: {host}",
          cancel: "Annulla",
          invalid: "Inserisci un indirizzo https, ad esempio media.example.com.",
          unreachable:
            "Questo indirizzo non risponde. Controllalo, insieme alla connessione.",
          "not-loomkeep": "Questo indirizzo non è un'istanza Loomkeep.",
        },
      };
      const locale =
        navigator.languages
          .map((language) => language.toLowerCase().split("-")[0])
          .find((language) => language in copy) ?? "en";
      const text = copy[locale];
      document.documentElement.lang = locale;
      for (const key of ["title", "body", "label", "connect", "reset", "cancel"]) {
        document.getElementById(key).textContent = text[key];
      }

      // ShellInstancePlugin.java opens this page with the instance the app is
      // on, and reopens it with what was typed and why it was refused.
      const params = new URLSearchParams(location.search);
      const current = params.get("current");
      const currentHost = current ? new URL(current).host : null;
      const address = document.getElementById("address");
      address.value = params.get("address") ?? "";
      document.getElementById("error").textContent =
        text[params.get("error")] ?? "";

      if (currentHost) {
        document.getElementById("current").textContent = text.current.replace(
          "{host}",
          currentHost,
        );
      }
      const reset = document.getElementById("reset");
      reset.hidden = currentHost === "loomkeep.app";
      reset.addEventListener("click", () => location.replace("/_instance"));

      const cancel = document.getElementById("cancel");
      cancel.hidden = !current;
      cancel.addEventListener("click", (event) => {
        event.preventDefault();
        location.replace(current);
      });

      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const connect = document.getElementById("connect");
        connect.disabled = true;
        connect.textContent = text.checking;
        // The plugin keeps the page as is while it checks the address.
        location.href = `/_instance?${new URLSearchParams({ use: address.value })}`;
      });
    </script>
  </body>
</html>
