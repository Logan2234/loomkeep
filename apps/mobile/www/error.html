<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loomkeep</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="body"></p>
      <button id="retry" type="button"></button>
      <a id="change"></a>
      <a
        id="update"
        href="https://play.google.com/store/apps/details?id=com.google.android.webview"></a>
    </main>
    <script>
      const copy = {
        en: {
          title: "Loomkeep can't load",
          body: "Check your connection and try again. If it keeps failing, update Android System WebView.",
          retry: "Try again",
          change: "Use another instance",
          update: "Update Android System WebView",
        },
        fr: {
          title: "Impossible de charger Loomkeep",
          body: "Vérifie ta connexion puis réessaie. Si le problème persiste, mets à jour Android System WebView.",
          retry: "Réessayer",
          change: "Utiliser une autre instance",
          update: "Mettre à jour Android System WebView",
        },
        it: {
          title: "Impossibile caricare Loomkeep",
          body: "Controlla la connessione e riprova. Se il problema persiste, aggiorna Android System WebView.",
          retry: "Riprova",
          change: "Usa un'altra istanza",
          update: "Aggiorna Android System WebView",
        },
      };
      const locale =
        navigator.languages
          .map((language) => language.toLowerCase().split("-")[0])
          .find((language) => language in copy) ?? "en";
      document.documentElement.lang = locale;
      for (const key of Object.keys(copy[locale])) {
        document.getElementById(key).textContent = copy[locale][key];
      }

      const retryUrl = new URLSearchParams(location.search).get("retry");
      document.getElementById("retry").addEventListener("click", () => {
        if (retryUrl) location.replace(retryUrl);
      });
      document.getElementById("change").href =
        `instance.html?${new URLSearchParams({ current: retryUrl ?? "" })}`;
    </script>
  </body>
</html>
