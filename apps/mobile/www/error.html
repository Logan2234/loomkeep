<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loomkeep</title>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("/shell-fonts/bricolage-grotesque.woff2") format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/shell-fonts/hanken-grotesk.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("/shell-fonts/space-mono.woff2") format("woff2");
      }
      :root {
        color-scheme: dark;
        --bg: #0c0d10;
        --fg: #ececea;
        --dim: #9aa0ae;
        --line: #2a2e38;
        --accent: #f5b841;
        --btn: #f5b841;
        --btn-fg: #1a1406;
        --danger: #f0647c;
      }
      /* ShellWebViewClient.java sets it from the app's last theme. */
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f7f5f3;
        --fg: #1c1712;
        --dim: #6b6354;
        --line: #d3c7a8;
        --accent: #8a5f0a;
        --btn: #1c1712;
        --btn-fg: #ffffff;
        --danger: #c73c57;
      }
      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: "Hanken Grotesk", system-ui, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .mark {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1rem;
      }
      .wordmark {
        color: var(--fg);
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 2rem;
      }
      .wordmark span {
        color: var(--accent);
      }
      .timecode {
        font-family: "Space Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        color: var(--dim);
        margin: 0 0 0.75rem;
      }
      main {
        width: 100%;
        max-width: 22rem;
        box-sizing: border-box;
        padding: 2rem 1.5rem;
      }
      [hidden] {
        display: none !important;
      }
      h1 {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--dim);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        border: 0;
        border-radius: 0.75rem;
        min-height: 3rem;
        padding: 0.75rem 1.5rem;
        background: var(--btn);
        color: var(--btn-fg);
        font: inherit;
        font-weight: 600;
        transition: opacity 150ms ease;
      }
      button:active {
        opacity: 0.8;
      }
      button:disabled {
        opacity: 0.6;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--line);
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        margin-top: 0.5rem;
        color: var(--accent);
        font-size: 0.875rem;
        transition: opacity 150ms ease;
      }
      a:active {
        opacity: 0.7;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        text-align: left;
      }
      label {
        font-size: 0.875rem;
        font-weight: 600;
      }
      input {
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        background: transparent;
        color: var(--fg);
        font: inherit;
        -webkit-user-select: text;
        user-select: text;
        transition: border-color 150ms ease;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      #pickError {
        color: var(--danger);
        font-size: 0.875rem;
        margin: 0;
      }
      #pickError:empty {
        display: none;
      }
      #current {
        font-size: 0.875rem;
        margin: 1.25rem 0 0;
      }
    </style>
  </head>
  <body>
    <main id="failure">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <g stroke-width="14" stroke-linecap="round">
          <line x1="16" y1="12" x2="16" y2="88" stroke="#d6a02a" />
          <line x1="36" y1="12" x2="36" y2="88" stroke="#1f9dae" />
          <line x1="56" y1="12" x2="56" y2="88" stroke="#d866a0" />
          <line x1="76" y1="12" x2="76" y2="88" stroke="#6e97e0" />
          <line x1="8" y1="30" x2="92" y2="30" stroke="#f5b841" />
          <line x1="36" y1="23" x2="36" y2="37" stroke="#1f9dae" />
          <line x1="76" y1="23" x2="76" y2="37" stroke="#6e97e0" />
        </g>
      </svg>
      <p class="wordmark">LOOM<span>KEEP</span></p>
      <p class="timecode" id="status"></p>
      <h1 id="title"></h1>
      <p id="body"></p>
      <button id="retry" type="button"></button>
      <a id="change" href="#pick"></a>
      <a
        id="update"
        href="https://play.google.com/store/apps/details?id=com.google.android.webview"></a>
    </main>
    <main id="picker" hidden>
      <h1 id="pickTitle"></h1>
      <p id="pickBody"></p>
      <form id="form">
        <label id="label" for="address"></label>
        <input
          id="address"
          type="text"
          inputmode="url"
          autocapitalize="none"
          autocomplete="url"
          spellcheck="false"
          placeholder="media.example.com"
          required />
        <p id="pickError" role="alert"></p>
        <button id="connect" type="submit"></button>
        <button id="reset" class="secondary" type="button"></button>
      </form>
      <p id="current"></p>
      <a id="cancel" href="#"></a>
    </main>
    <script>
      const copy = {
        en: {
          status: "00:00:00 · Offline",
          title: "Loomkeep can't be reached",
          body: "Check your connection. The app reloads on its own once it's back.",
          bodyOldWebView:
            "This version of Android System WebView is too old for Loomkeep. Update it, then try again.",
          retry: "Try again",
          retrying: "Connecting…",
          change: "Use another instance",
          update: "Update Android System WebView",
          pickTitle: "Choose your instance",
          pickBody: "Enter the address of the Loomkeep server you use.",
          label: "Instance address",
          connect: "Connect",
          checking: "Checking…",
          reset: "Use loomkeep.app",
          current: "Current instance: {host}",
          cancel: "Cancel",
          invalid: "Enter an https address, such as media.example.com.",
          unreachable:
            "This address doesn't answer. Check it, and your connection.",
          "not-loomkeep": "This address isn't a Loomkeep instance.",
        },
        fr: {
          status: "00:00:00 · Hors ligne",
          title: "Loomkeep est injoignable",
          body: "Vérifie ta connexion. L'app se recharge toute seule dès qu'elle revient.",
          bodyOldWebView:
            "Cette version d'Android System WebView est trop ancienne pour Loomkeep. Mets-la à jour, puis réessaie.",
          retry: "Réessayer",
          retrying: "Connexion…",
          change: "Utiliser une autre instance",
          update: "Mettre à jour Android System WebView",
          pickTitle: "Choisir ton instance",
          pickBody: "Saisis l'adresse du serveur Loomkeep que tu utilises.",
          label: "Adresse de l'instance",
          connect: "Se connecter",
          checking: "Vérification…",
          reset: "Utiliser loomkeep.app",
          current: "Instance actuelle : {host}",
          cancel: "Annuler",
          invalid: "Saisis une adresse en https, par exemple media.example.com.",
          unreachable:
            "Cette adresse ne répond pas. Vérifie-la, ainsi que ta connexion.",
          "not-loomkeep": "Cette adresse n'est pas une instance Loomkeep.",
        },
        it: {
          status: "00:00:00 · Offline",
          title: "Loomkeep non è raggiungibile",
          body: "Controlla la connessione. L'app si ricarica da sola appena torna.",
          bodyOldWebView:
            "Questa versione di Android System WebView è troppo vecchia per Loomkeep. Aggiornala, poi riprova.",
          retry: "Riprova",
          retrying: "Connessione…",
          change: "Usa un'altra istanza",
          update: "Aggiorna Android System WebView",
          pickTitle: "Scegli la tua istanza",
          pickBody: "Inserisci l'indirizzo del server Loomkeep che usi.",
          label: "Indirizzo dell'istanza",
          connect: "Connetti",
          checking: "Verifica…",
          reset: "Usa loomkeep.app",
          current: "Istanza attuale: {host}",
          cancel: "Annulla",
          invalid: "Inserisci un indirizzo https, ad esempio media.example.com.",
          unreachable:
            "Questo indirizzo non risponde. Controllalo, insieme alla connessione.",
          "not-loomkeep": "Questo indirizzo non è un'istanza Loomkeep.",
        },
      };
      const ERRORS = ["invalid", "unreachable", "not-loomkeep"];
      const locale =
        navigator.languages
          .map((language) => language.toLowerCase().split("-")[0])
          .find((language) => language in copy) ?? "en";
      const text = copy[locale];
      document.documentElement.lang = locale;
      for (const key of Object.keys(text)) {
        const element = document.getElementById(key);
        if (element) element.textContent = text[key];
      }

      // ShellWebViewClient.java serves this page alone, so the instance
      // picker (MOB-15) is its #pick view. ShellInstancePlugin.java opens it, and
      // reopens it with what was typed and why it was refused; any page can
      // link here with other values, so they're only ever displayed. The
      // same goes for ?retry: only a web address is followed, never a
      // javascript: or data: URL that would run in this page.
      let retryUrl = null;
      try {
        const url = new URL(new URLSearchParams(location.search).get("retry"));
        if (url.protocol === "https:" || url.protocol === "http:") {
          retryUrl = url;
        }
      } catch {
        // Opened without its instance: nothing to retry or show.
      }
      const retryButton = document.getElementById("retry");
      function retry() {
        if (!retryUrl) return;
        retryButton.disabled = true;
        retryButton.textContent = text.retrying;
        location.replace(retryUrl.href);
      }
      retryButton.addEventListener("click", retry);

      // Same bar as capacitor.config.ts's minWebViewVersion, the one case
      // where updating the WebView is the answer rather than the network.
      const chrome = /Chrome\/(\d+)/.exec(navigator.userAgent ?? "");
      const webViewTooOld = chrome !== null && Number(chrome[1]) < 111;
      document.getElementById("update").hidden = !webViewTooOld;
      if (webViewTooOld) {
        document.getElementById("body").textContent = text.bodyOldWebView;
      }

      addEventListener("online", () => {
        if (!webViewTooOld && !location.hash.includes("pick")) retry();
      });

      const currentHost = retryUrl?.host ?? null;
      if (currentHost) {
        document.getElementById("current").textContent = text.current.replace(
          "{host}",
          currentHost,
        );
      }
      document.getElementById("reset").hidden = currentHost === "loomkeep.app";

      const address = document.getElementById("address");
      const connect = document.getElementById("connect");

      function render() {
        const view = new URLSearchParams(location.hash.slice(1));
        const picking = view.has("pick");
        document.getElementById("failure").hidden = picking;
        document.getElementById("picker").hidden = !picking;
        if (!picking) return;

        address.value = view.get("address") ?? "";
        const error = view.get("error");
        document.getElementById("pickError").textContent = ERRORS.includes(
          error,
        )
          ? text[error]
          : "";
        connect.disabled = false;
        connect.textContent = text.connect;
      }
      render();
      addEventListener("hashchange", render);

      // The /_instance navigations are the plugin's: this page has no bridge.
      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        connect.disabled = true;
        connect.textContent = text.checking;
        location.href = `/_instance?${new URLSearchParams({ use: address.value })}`;
      });
      document
        .getElementById("reset")
        .addEventListener("click", () => location.replace("/_instance"));
      document.getElementById("cancel").addEventListener("click", (event) => {
        event.preventDefault();
        location.replace("/_instance?cancel");
      });
    </script>
  </body>
</html>
