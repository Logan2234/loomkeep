apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Follows the lockstep version bumped across every workspace package.json.
def mobilePackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
// Android refuses an update with a lower versionCode (the Play Store, an
// equal one too):
// 1.11.0 → 1011000, rising with every bump as long as minor and patch stay
// under 1000.
def (major, minor, patch) = mobilePackage.version.tokenize('.')*.toInteger()
def mobileVersionCode = major * 1_000_000 + minor * 1_000 + patch

// Firebase's config, put there by CI: without it capacitor.config.ts leaves
// the push plugin out, and src/push, which builds on it, stays out too.
def hasFirebase = file('google-services.json').exists()

android {
    namespace = "app.loomkeep"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.loomkeep"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersionCode
        versionName mobilePackage.version
        resValue "string", "app_name", "Loomkeep"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        resValues = true
        // Glance draws the home-screen widgets with Compose (MOB-20).
        compose = true
    }
    sourceSets {
        main {
            if (hasFirebase) java.srcDirs += 'src/push/java'
        }
    }
    signingConfigs {
        // CI signs with the shared debug key (ci.yml), so each build
        // installs over the last and matches ANDROID_APP_LINKS. Pointed at
        // explicitly: the runner's default debug keystore isn't the one
        // ~/.android holds, and changed with every run. Elsewhere, the
        // machine's own debug key.
        debug {
            def sharedKeystore = System.getenv("LOOMKEEP_DEBUG_KEYSTORE")
            if (sharedKeystore) {
                storeFile file(sharedKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        // The key every published release is signed with (MOB-23), restored
        // by ci.yml: Android installs an update only when it's signed
        // by the same key, so it can never change. Without it, the release
        // build comes out unsigned.
        release {
            def releaseKeystore = System.getenv("LOOMKEEP_RELEASE_KEYSTORE")
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("LOOMKEEP_RELEASE_KEYSTORE_PASSWORD")
                keyAlias "loomkeep"
                keyPassword System.getenv("LOOMKEEP_RELEASE_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        // Installs next to the store build instead of replacing it.
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "Loomkeep Dev"
        }
        release {
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Matches the Java 21 target capacitor.build.gradle sets.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Already in the APK through Capacitor, at the same version: declared for
    // MainActivity's WebAuthn switch.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // Already in the APK through the push plugin, at the same version:
    // declared for ShellMessagingService (MOB-17).
    if (hasFirebase) {
        implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
