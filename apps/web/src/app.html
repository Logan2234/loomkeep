<!doctype html>
<html lang="%paraglide.lang%" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f2ebdc" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0c0d10" />

    <link rel="manifest" href="/manifest.webmanifest?lang=%paraglide.lang%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      const localeMap = { fr: "fr-FR", en: "en-US" };
      let locale;

      try {
        const cookie = document.cookie
          .split("; ")
          .find((row) => row.startsWith("PARAGLIDE_LOCALE="));
        const fromCookie = cookie?.split("=")[1];

        if (fromCookie && Object.hasOwn(localeMap, fromCookie)) {
          locale = fromCookie;
        }
      } catch {}

      if (!locale) {
        locale =
          (navigator.languages?.length
            ? navigator.languages
            : [navigator.language || "en"]
          )
            .map((language) => language.toLowerCase().split("-")[0])
            .find((language) => Object.hasOwn(localeMap, language)) || "en";
      }
      document.documentElement.lang = localeMap[locale];
      document.querySelector('link[rel="manifest"]').href =
        "/manifest.webmanifest?lang=" + locale;

      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("tl-theme");
        const dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
