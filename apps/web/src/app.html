<!doctype html>
<html lang="%paraglide.lang%" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0 on notched iOS; the bottom bar, drawers and modals
         all pad themselves with it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- One tag, no `media`: the app theme is chosen in the settings, not by
         the OS, so the boot script below and `theme.svelte.ts` drive it. -->
    <meta name="theme-color" content="#0c0d10" />

    <link rel="manifest" href="/manifest.webmanifest?lang=%paraglide.lang%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      const localeMap = { fr: "fr-FR", en: "en-US" };
      let locale;

      try {
        const cookie = document.cookie
          .split("; ")
          .find((row) => row.startsWith("PARAGLIDE_LOCALE="));
        const fromCookie = cookie?.split("=")[1];

        if (fromCookie && Object.hasOwn(localeMap, fromCookie)) {
          locale = fromCookie;
        }
      } catch {}

      if (!locale) {
        locale =
          (navigator.languages?.length
            ? navigator.languages
            : [navigator.language || "en"]
          )
            .map((language) => language.toLowerCase().split("-")[0])
            .find((language) => Object.hasOwn(localeMap, language)) || "en";
      }
      document.documentElement.lang = localeMap[locale];
      document.querySelector('link[rel="manifest"]').href =
        "/manifest.webmanifest?lang=" + locale;

      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("lk-theme");
        const dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#0c0d10"
          : "#f2ebdc";

        if (localStorage.getItem("lk-a11y-motion") === "reduce") {
          document.documentElement.classList.add("a11y-reduce-motion");
        }
        if (localStorage.getItem("lk-a11y-contrast") === "high") {
          document.documentElement.classList.add("a11y-high-contrast");
        }
        const density = localStorage.getItem("lk-a11y-density");
        if (density === "compact" || density === "comfortable") {
          document.documentElement.classList.add("a11y-" + density);
        }
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
