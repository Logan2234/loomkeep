# Override for hosting Loomkeep publicly on a VPS with a real domain
# (e.g. OVH) behind Caddy, which obtains and renews a Let's Encrypt
# certificate automatically. Use it on top of the base compose:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Point the domain's A/AAAA record at the VPS and open ports 80+443 first
# (see README "Public hosting (VPS)").
services:
  web:
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: https://${DOMAIN:?set DOMAIN in .env}/api

  api:
    environment:
      # Explicit, not just "unset" — several deps (this app's own isDev
      # checks in main.ts/logger.config.ts included) only special-case the
      # literal string "development"; NODE_ENV was never set to anything at
      # all before, which happened to read the same way but left it to
      # chance for any third-party package that specifically checks for
      # "production" instead.
      NODE_ENV: production
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # This is the public instance — turn the P4 social features on (the
      # web reads this back via GET /api/config).
      SOCIAL_ENABLED: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Same rotation as the base compose's services — Compose doesn't merge
    # YAML anchors across -f files, so this is a deliberate duplicate of
    # docker-compose.yml's `x-logging`, not drift.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - api
      - web
    environment:
      SITE_ADDRESS: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www-redirect.caddy:/etc/caddy/sites-enabled/www-redirect.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy-data:
  caddy-config:
